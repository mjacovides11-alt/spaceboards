<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Spaceboards</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    font-family: Arial, Helvetica, sans-serif;
    color: #111;
    background: #fafafa;
    overflow: hidden;
}

button,
input {
    font: inherit;
}

button {
    border: 1px solid #bbb;
    background: white;
    border-radius: 7px;
    padding: 8px 14px;
    cursor: pointer;
}

button:hover {
    background: #f2f2f2;
}

/* TOP BAR */

.topbar {
    height: 58px;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    background: white;
    border-bottom: 1px solid #ddd;
    position: relative;
    z-index: 20;
}

.logo {
    font-weight: bold;
    margin-left: 8px;
}

.spacer {
    flex: 1;
}

.search {
    width: 300px;
    max-width: 35vw;
    padding: 9px 11px;
    border: 1px solid #bbb;
    border-radius: 7px;
    outline: none;
}

.search:focus {
    border-color: #555;
}

/* WORKSPACE */

#workspace {
    position: absolute;
    top: 58px;
    left: 0;
    right: 0;
    bottom: 0;
    overflow: hidden;
    background: #fafafa;
    touch-action: none;
}

#world {
    position: absolute;
    width: 1px;
    height: 1px;
    transform-origin: 0 0;
}

/* BOARDS */

.board {
    position: absolute;
    background: white;
    border: 1px solid #aaa;
    border-radius: 10px;
    box-shadow: 0 2px 10px rgba(0,0,0,.08);
}

.board.selected {
    outline: 2px solid #222;
}

.board-title {
    position: absolute;
    top: -31px;
    left: 8px;
    font-size: 14px;
    font-weight: bold;
    white-space: nowrap;
    user-select: none;
}

.board-inner {
    width: 100%;
    height: 100%;
    padding: 14px;
    overflow: auto;
    border-radius: 10px;
}

/* ITEMS */

.item {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    max-width: 100%;
    margin: 4px;
    padding: 7px 9px;
    background: white;
    border: 1px solid #ddd;
    border-radius: 7px;
    cursor: pointer;
    word-break: break-word;
}

.item:hover {
    background: #f5f5f5;
}

.item img {
    width: 34px;
    height: 34px;
    object-fit: cover;
    border-radius: 5px;
}

/* RESIZE HANDLE */

.resize {
    position: absolute;
    width: 12px;
    height: 12px;
    right: -6px;
    bottom: -6px;
    background: white;
    border: 1px solid #777;
    border-radius: 3px;
    cursor: nwse-resize;
}

/* MENU */

.menu {
    position: fixed;
    display: none;
    min-width: 150px;
    background: white;
    border: 1px solid #aaa;
    border-radius: 7px;
    box-shadow: 0 5px 20px rgba(0,0,0,.15);
    z-index: 200;
}

.menu div {
    padding: 10px 13px;
    cursor: pointer;
}

.menu div:hover {
    background: #eee;
}

/* MODAL */

.modal-bg {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.55);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
}

.modal {
    width: min(440px, 92vw);
    background: white;
    border-radius: 12px;
    padding: 20px;
    box-shadow: 0 15px 50px rgba(0,0,0,.3);
}

.modal h2 {
    margin-top: 0;
}

.modal input {
    width: 100%;
    padding: 10px;
    margin: 5px 0 12px;
    border: 1px solid #aaa;
    border-radius: 7px;
}

.modal-actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
}

/* LOGIN */

#login {
    position: fixed;
    inset: 0;
    background: white;
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 500;
}

.login-box {
    width: min(380px, 90vw);
    padding: 25px;
    border: 1px solid #ddd;
    border-radius: 12px;
    box-shadow: 0 5px 30px rgba(0,0,0,.08);
}

.login-box h1 {
    margin-top: 0;
}

.login-box input {
    width: 100%;
    padding: 11px;
    margin: 7px 0 12px;
    border: 1px solid #aaa;
    border-radius: 7px;
}

/* HELP */

.hint {
    position: fixed;
    left: 12px;
    bottom: 12px;
    background: white;
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 12px;
    color: #555;
    z-index: 10;
}

@media(max-width: 600px) {

    .logo {
        display: none;
    }

    .topbar {
        gap: 4px;
        padding: 7px;
    }

    .topbar button {
        padding: 8px;
    }

    .search {
        width: 28vw;
    }
}
</style>
</head>

<body>

<!-- LOGIN -->

<div id="login">

    <div class="login-box">

        <h1>Spaceboards</h1>

        <p>Enter your username to continue.</p>

        <input
            id="loginName"
            type="text"
            placeholder="Username"
        >

        <button id="loginBtn">
            Login
        </button>

    </div>

</div>


<!-- TOP BAR -->

<header class="topbar">

    <button id="newBtn">
        New
    </button>

    <button id="backupBtn">
        Backup
    </button>

    <button id="restoreBtn">
        Restore
    </button>

    <button id="shareBtn">
        Share
    </button>

    <button id="logoutBtn">
        Logout
    </button>

    <div class="logo">
        Spaceboards
    </div>

    <div class="spacer"></div>

    <input
        id="search"
        class="search"
        type="text"
        placeholder="Search"
    >

    <button id="mySpace">
        My space
    </button>

</header>


<!-- WORKSPACE -->

<main id="workspace">

    <div id="world"></div>

</main>


<div class="hint">
    Click "New" to create a board. Drag boards to move them.
    Drag the bottom-right corner to resize.
</div>


<!-- RIGHT CLICK MENU -->

<div class="menu" id="menu">

    <div id="renameOpt">
        Rename
    </div>

    <div id="deleteOpt">
        Delete
    </div>

</div>


<!-- MODAL -->

<div class="modal-bg" id="modalBg">

    <div class="modal" id="modal"></div>

</div>


<!-- RESTORE FILE -->

<input
    id="restoreFile"
    type="file"
    accept=".json"
    hidden
>


<script>

/* =========================================================
   DATA
========================================================= */

const STORAGE_KEY = "spaceboards-v1";

const defaultData = {

    user: "",

    zoom: 1,

    panX: 80,

    panY: 80,

    boards: [

        {
            id: "board-1",

            title: "Friends",

            x: 80,

            y: 110,

            w: 430,

            h: 270,

            items: []
        }

    ]

};


let data = loadData();

let selectedBoard = null;

let menuBoard = null;

let drawing = null;

let moving = null;

let resizing = null;


/* =========================================================
   STORAGE
========================================================= */

function loadData() {

    try {

        const saved =
            localStorage.getItem(STORAGE_KEY);

        if (saved) {

            return JSON.parse(saved);

        }

    } catch (error) {

        console.error(error);

    }

    return structuredClone(defaultData);
}


function saveData() {

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(data)
    );

}


/* =========================================================
   HELPERS
========================================================= */

function escapeHTML(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


function createID() {

    if (crypto.randomUUID) {

        return crypto.randomUUID();

    }

    return Date.now() + "-" + Math.random();

}


/* Convert screen coordinates into board/world coordinates */

function screenToWorld(x, y) {

    return {

        x:
            (x - data.panX)
            / data.zoom,

        y:
            (y - 58 - data.panY)
            / data.zoom

    };

}


/* =========================================================
   RENDER
========================================================= */

function render() {

    const world =
        document.getElementById("world");

    world.style.transform =
        `translate(${data.panX}px,
                   ${data.panY}px)
         scale(${data.zoom})`;

    world.innerHTML = "";


    data.boards.forEach(board => {

        const element =
            document.createElement("section");


        element.className =
            "board" +
            (
                selectedBoard === board.id
                    ? " selected"
                    : ""
            );


        element.dataset.id =
            board.id;


        element.style.left =
            board.x + "px";

        element.style.top =
            board.y + "px";

        element.style.width =
            board.w + "px";

        element.style.height =
            board.h + "px";


        let itemsHTML = "";


        board.items.forEach(item => {

            itemsHTML += `

                <div
                    class="item"
                    data-item="${item.id}"
                    title="${escapeHTML(item.url)}"
                >

                    ${
                        item.image
                        ?
                        `<img
                            src="${escapeHTML(item.image)}"
                            alt=""
                        >`
                        :
                        ""
                    }

                    <span>
                        ${escapeHTML(item.title || item.url)}
                    </span>

                </div>

            `;

        });


        element.innerHTML = `

            <div class="board-title">
                ${escapeHTML(board.title)}
            </div>

            <div class="board-inner">
                ${itemsHTML}
            </div>

            <div class="resize"></div>

        `;


        /* SELECT BOARD */

        element.addEventListener(
            "click",
            event => {

                if (
                    event.target.closest(".item")
                ) {

                    return;

                }

                selectedBoard =
                    board.id;

                render();

            }
        );


        /* RIGHT CLICK */

        element.addEventListener(
            "contextmenu",
            event => {

                event.preventDefault();

                showMenu(
                    event.clientX,
                    event.clientY,
                    board.id
                );

            }
        );


        /* OPEN ITEM */

        element
            .querySelector(".board-inner")
            .addEventListener(
                "click",
                event => {

                    const item =
                        event.target.closest(".item");

                    if (!item) {

                        return;

                    }

                    const itemData =
                        board.items.find(
                            i =>
                                i.id ===
                                item.dataset.item
                        );


                    if (
                        itemData &&
                        itemData.url
                    ) {

                        window.open(
                            itemData.url,
                            "_blank"
                        );

                    }

                }
            );


        /* BOARD DRAG / RESIZE */

        element.addEventListener(
            "pointerdown",
            event => {

                if (
                    event.target.closest(".resize")
                ) {

                    event.stopPropagation();

                    resizing = {

                        id: board.id,

                        startX:
                            event.clientX,

                        startY:
                            event.clientY,

                        width:
                            board.w,

                        height:
                            board.h

                    };

                    element.setPointerCapture(
                        event.pointerId
                    );

                    return;

                }


                if (
                    event.target.closest(".item")
                ) {

                    return;

                }


                if (event.button !== 0) {

                    return;

                }


                moving = {

                    id: board.id,

                    startX:
                        event.clientX,

                    startY:
                        event.clientY,

                    x:
                        board.x,

                    y:
                        board.y

                };


                element.setPointerCapture(
                    event.pointerId
                );

            }
        );


        element.addEventListener(
            "pointermove",
            event => {

                if (
                    resizing &&
                    resizing.id === board.id
                ) {

                    board.w =
                        Math.max(
                            150,
                            resizing.width +
                            (
                                event.clientX -
                                resizing.startX
                            ) / data.zoom
                        );


                    board.h =
                        Math.max(
                            100,
                            resizing.height +
                            (
                                event.clientY -
                                resizing.startY
                            ) / data.zoom
                        );


                    render();

                    return;

                }


                if (
                    moving &&
                    moving.id === board.id
                ) {

                    board.x =
                        moving.x +
                        (
                            event.clientX -
                            moving.startX
                        ) / data.zoom;


                    board.y =
                        moving.y +
                        (
                            event.clientY -
                            moving.startY
                        ) / data.zoom;


                    render();

                }

            }
        );


        element.addEventListener(
            "pointerup",
            () => {

                moving = null;

                resizing = null;

                saveData();

            }
        );


        world.appendChild(element);

    });

}


/* =========================================================
   NEW BUTTON
========================================================= */

document
    .getElementById("newBtn")
    .addEventListener(
        "click",
        () => {

            const board = {

                id: createID(),

                title: "New board",

                x:
                    (-data.panX + 120)
                    / data.zoom,

                y:
                    (-data.panY + 130)
                    / data.zoom,

                w: 430,

                h: 270,

                items: []

            };


            data.boards.push(board);

            selectedBoard =
                board.id;

            saveData();

            render();

            addItemModal(board);

        }
    );


/* =========================================================
   ADD ITEM
========================================================= */

function addItemModal(board) {

    openModal(`

        <h2>Add item</h2>

        <input
            id="itemTitle"
            placeholder="Name (optional)"
        >

        <input
            id="itemURL"
            placeholder="https://example.com"
        >

        <input
            id="itemImage"
            placeholder="Image URL (optional)"
        >

        <div class="modal-actions">

            <button onclick="closeModal()">
                Cancel
            </button>

            <button id="addItemButton">
                Add
            </button>

        </div>

    `);


    document
        .getElementById("addItemButton")
        .onclick = () => {

            let url =
                document
                    .getElementById("itemURL")
                    .value
                    .trim();


            if (!url) {

                alert("Please enter a URL.");

                return;

            }


            if (
                !/^https?:\/\//i.test(url)
            ) {

                url =
                    "https://" + url;

            }


            const title =
                document
                    .getElementById("itemTitle")
                    .value
                    .trim();


            const image =
                document
                    .getElementById("itemImage")
                    .value
                    .trim();


            board.items.push({

                id: createID(),

                title:
                    title || url,

                url: url,

                image: image

            });


            saveData();

            closeModal();

            render();

        };

}


/* =========================================================
   RIGHT CLICK MENU
========================================================= */

function showMenu(x, y, boardID) {

    menuBoard = boardID;

    const menu =
        document.getElementById("menu");

    menu.style.display =
        "block";

    menu.style.left =
        x + "px";

    menu.style.top =
        y + "px";

}


function hideMenu() {

    document
        .getElementById("menu")
        .style.display =
        "none";

}


document.addEventListener(
    "pointerdown",
    event => {

        if (
            !event.target.closest("#menu")
        ) {

            hideMenu();

        }

    }
);


/* =========================================================
   RENAME
========================================================= */

document
    .getElementById("renameOpt")
    .onclick = () => {

        hideMenu();

        const board =
            data.boards.find(
                b =>
                    b.id === menuBoard
            );


        if (!board) {

            return;

        }


        openModal(`

            <h2>Rename board</h2>

            <input
                id="renameInput"
                value="${escapeHTML(board.title)}"
            >

            <div class="modal-actions">

                <button onclick="closeModal()">
                    Cancel
                </button>

                <button id="renameSave">
                    Save
                </button>

            </div>

        `);


        document
            .getElementById("renameSave")
            .onclick = () => {

                const name =
                    document
                        .getElementById("renameInput")
                        .value
                        .trim();


                board.title =
                    name || "Untitled";


                saveData();

                closeModal();

                render();

            };

    };


/* =========================================================
   DELETE
========================================================= */

document
    .getElementById("deleteOpt")
    .onclick = () => {

        hideMenu();

        if (
            !confirm(
                "Delete this board?"
            )
        ) {

            return;

        }


        data.boards =
            data.boards.filter(
                board =>
                    board.id !== menuBoard
            );


        selectedBoard = null;

        saveData();

        render();

    };


/* =========================================================
   DRAW NEW BOARD
========================================================= */

document
    .getElementById("workspace")
    .addEventListener(
        "pointerdown",
        event => {

            if (
                event.target.closest(".board")
            ) {

                return;

            }


            if (event.button !== 0) {

                return;

            }


            const point =
                screenToWorld(
                    event.clientX,
                    event.clientY
                );


            drawing = {

                startX:
                    point.x,

                startY:
                    point.y,

                clientX:
                    event.clientX,

                clientY:
                    event.clientY

            };

        }
    );


document.addEventListener(
    "pointermove",
    event => {

        if (!drawing) {

            return;

        }


        const point =
            screenToWorld(
                event.clientX,
                event.clientY
            );


        const x =
            Math.min(
                drawing.startX,
                point.x
            );


        const y =
            Math.min(
                drawing.startY,
                point.y
            );


        const width =
            Math.abs(
                point.x -
                drawing.startX
            );


        const height =
            Math.abs(
                point.y -
                drawing.startY
            );


        let temp =
            document.getElementById(
                "drawTemp"
            );


        if (!temp) {

            temp =
                document.createElement(
                    "div"
                );

            temp.id =
                "drawTemp";

            temp.className =
                "board";

            document
                .getElementById("world")
                .appendChild(temp);

        }


        temp.style.left =
            x + "px";

        temp.style.top =
            y + "px";

        temp.style.width =
            Math.max(
                10,
                width
            ) + "px";

        temp.style.height =
            Math.max(
                10,
                height
            ) + "px";

    }
);


document.addEventListener(
    "pointerup",
    event => {

        if (!drawing) {

            return;

        }


        const point =
            screenToWorld(
                event.clientX,
                event.clientY
            );


        const x =
            Math.min(
                drawing.startX,
                point.x
            );


        const y =
            Math.min(
                drawing.startY,
                point.y
            );


        const width =
            Math.abs(
                point.x -
                drawing.startX
            );


        const height =
            Math.abs(
                point.y -
                drawing.startY
            );


        document
            .getElementById("drawTemp")
            ?.remove();


        drawing = null;


        if (
            width < 30 ||
            height < 30
        ) {

            return;

        }


        const board = {

            id: createID(),

            title: "New board",

            x: x,

            y: y,

            w: Math.max(
                180,
                width
            ),

            h: Math.max(
                120,
                height
            ),

            items: []

        };


        data.boards.push(board);

        selectedBoard =
            board.id;

        saveData();

        render();

        addItemModal(board);

    }
);


/* =========================================================
   SEARCH
========================================================= */

document
    .getElementById("search")
    .addEventListener(
        "input",
        event => {

            const query =
                event.target.value
                    .toLowerCase()
                    .trim();


            document
                .querySelectorAll(".board")
                .forEach(element => {

                    const board =
                        data.boards.find(
                            b =>
                                b.id ===
                                element.dataset.id
                        );


                    if (!board) {

                        return;

                    }


                    const matches =
                        !query ||
                        board.title
                            .toLowerCase()
                            .includes(query) ||
                        board.items.some(
                            item =>
                                (
                                    item.title ||
                                    ""
                                )
                                .toLowerCase()
                                .includes(query)
                        );


                    element.style.opacity =
                        matches
                            ? "1"
                            : "0.2";

                });

        }
    );


/* =========================================================
   BACKUP
========================================================= */

document
    .getElementById("backupBtn")
    .onclick = () => {

        const blob =
            new Blob(
                [
                    JSON.stringify(
                        data,
                        null,
                        2
                    )
                ],
                {
                    type:
                        "application/json"
                }
            );


        const url =
            URL.createObjectURL(blob);


        const link =
            document.createElement("a");


        link.href = url;

        link.download =
            "spaceboards-backup.json";


        link.click();


        URL.revokeObjectURL(url);

    };


/* =========================================================
   RESTORE
========================================================= */

document
    .getElementById("restoreBtn")
    .onclick = () => {

        document
            .getElementById("restoreFile")
            .click();

    };


document
    .getElementById("restoreFile")
    .addEventListener(
        "change",
        event => {

            const file =
                event.target.files[0];


            if (!file) {

                return;

            }


            const reader =
                new FileReader();


            reader.onload = () => {

                try {

                    data =
                        JSON.parse(
                            reader.result
                        );


                    saveData();

                    render();

                    alert(
                        "Backup restored."
                    );

                } catch {

                    alert(
                        "Invalid backup file."
                    );

                }

            };


            reader.readAsText(file);

        }
    );


/* =========================================================
   SHARE
========================================================= */

document
    .getElementById("shareBtn")
    .onclick = async () => {

        const encoded =
            btoa(
                unescape(
                    encodeURIComponent(
                        JSON.stringify(data)
                    )
                )
            );


        const shareURL =
            location.href
            .split("#")[0]
            + "#data="
            + encoded;


        try {

            await navigator.clipboard.writeText(
                shareURL
            );

            alert(
                "Share link copied."
            );

        } catch {

            prompt(
                "Copy this link:",
                shareURL
            );

        }

    };


/* =========================================================
   MY SPACE
========================================================= */

document
    .getElementById("mySpace")
    .onclick = () => {

        data.panX = 80;

        data.panY = 80;

        data.zoom = 1;

        saveData();

        render();

    };


/* =========================================================
   ZOOM
========================================================= */

document
    .getElementById("workspace")
    .addEventListener(
        "wheel",
        event => {

            event.preventDefault();


            const oldZoom =
                data.zoom;


            const factor =
                event.deltaY < 0
                    ? 1.1
                    : 0.9;


            const rect =
                document
                    .getElementById(
                        "workspace"
                    )
                    .getBoundingClientRect();


            const mouseX =
                event.clientX -
                rect.left;


            const mouseY =
                event.clientY -
                rect.top;


            data.zoom =
                Math.min(
                    3,
                    Math.max(
                        .25,
                        oldZoom *
                        factor
                    )
                );


            data.panX =
                mouseX -
                (
                    mouseX -
                    data.panX
                ) *
                data.zoom /
                oldZoom;


            data.panY =
                mouseY -
                (
                    mouseY -
                    58 -
                    data.panY
                ) *
                data.zoom /
                oldZoom;


            saveData();

            render();

        },
        {
            passive: false
        }
    );


/* =========================================================
   MODALS
========================================================= */

function openModal(content) {

    document
        .getElementById("modal")
        .innerHTML =
        content;


    document
        .getElementById("modalBg")
        .style.display =
        "flex";

}


function closeModal() {

    document
        .getElementById("modalBg")
        .style.display =
        "none";

}


window.closeModal =
    closeModal;


document
    .getElementById("modalBg")
    .addEventListener(
        "click",
        event => {

            if (
                event.target.id ===
                "modalBg"
            ) {

                closeModal();

            }

        }
    );


/* =========================================================
   LOGIN
========================================================= */

document
    .getElementById("loginBtn")
    .onclick = () => {

        const username =
            document
                .getElementById("loginName")
                .value
                .trim();


        data.user =
            username || "User";


        saveData();


        document
            .getElementById("login")
            .style.display =
            "none";


        render();

    };


document
    .getElementById("logoutBtn")
    .onclick = () => {

        data.user = "";

        saveData();


        document
            .getElementById("login")
            .style.display =
            "flex";

    };


/* =========================================================
   LOAD SHARED DATA
========================================================= */

if (
    location.hash.startsWith("#data=")
) {

    try {

        const encoded =
            location.hash.slice(6);


        data =
            JSON.parse(
                decodeURIComponent(
                    escape(
                        atob(encoded)
                    )
                )
            );


        saveData();


        history.replaceState(
            null,
            "",
            location.pathname
        );

    } catch {

        console.log(
            "Could not load shared data."
        );

    }

}


/* =========================================================
   START
========================================================= */

if (!data.user) {

    document
        .getElementById("login")
        .style.display =
        "flex";

}


render();

</script>

</body>
