<head>

<title>Spaceboards</title>

<style>

*{
box-sizing:border-box;
}

html,
body{
margin:0;
width:100%;
height:100%;

}

button,
input{

button{

.hidden{

/* =========================================================
AUTH
========================================================= */

#authScreen{
position:fixed;
inset:0;

align-items:center;
justify-content:center;
background:#0b0b0d;
z-index:10000;
}

.auth-card{

border-radius:18px;
padding:32px;

.auth-card h1{

.auth-description{

.auth-card input{

width:100%;
height:46px;
margin-bottom:12px;

border:1px solid #343438;
border-radius:9px;

.auth-buttons{

#loginButton{

}

#signupButton{

#signupButton:hover{

}

.auth-error{

margin-top:14px;

/* =========================================================
TOP BAR
========================================================= */

#app{
position:fixed;
inset:0;
display:flex;
flex-direction:column;
}

#topbar{
height:64px;
background:#111113;
border-bottom:1px solid #29292d;

align-items:center;

.logo{

#searchInput{

width:240px;
max-width:30vw;

.top-button{

#profileName{

color:#aaa;
max-width:180px;
overflow:hidden;
text-overflow:ellipsis;

/* =========================================================
WORKSPACE
========================================================= */

#workspace{
position:relative;
flex:1;
overflow:hidden;
touch-action:none;
background-color:#0b0b0d;
background-image:
radial-gradient(#29292d 1px,transparent 1px);

}

#world{
position:absolute;
left:0;
top:0;
width:1px;
height:1px;

}


/* =========================================================
BOARDS
========================================================= */

.board{
position:absolute;
background:#171719;
border:1px solid #343438;
border-radius:14px;
box-shadow:0 8px 30px rgba(0,0,0,.55);

touch-action:none;
}

.board.selected{
border:2px solid #aaa;
}

.board-title{
position:absolute;
left:0;
top:-38px;
font-size:16px;
font-weight:700;
white-space:nowrap;
max-width:350px;
overflow:hidden;
text-overflow:ellipsis;
color:#ddd;
}

.board-actions{
position:absolute;
right:8px;
top:8px;
z-index:20;
}

.trash-button,
.item-trash{
width:30px;
height:30px;
border-radius:7px;
background:#29292d;
color:#ddd;
font-size:14px;
}

.trash-button:hover,
.item-trash:hover{
background:#492929;
color:#ff7777;
}

.board-inner{
position:absolute;
inset:14px;
overflow:auto;
padding-top:2px;
}

.add-url{
width:100%;
height:38px;
border-radius:8px;
background:#e8e8e8;
color:#111;
font-weight:600;
margin-bottom:10px;
}

.add-url:hover{

}


/* =========================================================
ITEMS
========================================================= */

.item{
position:relative;
display:flex;
align-items:center;
gap:10px;
min-height:58px;
padding:8px 42px 8px 9px;
margin-bottom:8px;
border:1px solid #343438;
border-radius:9px;
background:#202023;
color:#eee;
cursor:pointer;
}

.item:hover{
background:#2a2a2e;
}

.item img{
width:42px;
height:42px;

border-radius:7px;

}

.item-content{

flex:1;
}

.item-nickname{
font-size:11px;
color:#888;
margin-bottom:2px;
}

.item-title{
font-size:14px;
font-weight:600;
overflow:hidden;
text-overflow:ellipsis;

}

.item-visibility{
position:absolute;

top:7px;

color:#888;
}

.item-trash{
position:absolute;
right:7px;
bottom:7px;
width:25px;
height:25px;
font-size:11px;
}


/* =========================================================
RESIZE
========================================================= */

.resize{
position:absolute;
right:0;
bottom:0;
width:22px;
height:22px;
cursor:nwse-resize;
}

.resize::after{
content:"";
position:absolute;
right:5px;
bottom:5px;
width:10px;
height:10px;
border-right:2px solid #777;
border-bottom:2px solid #777;
}


/* =========================================================
FRIENDS SIDEBAR
========================================================= */

right:14px;
top:78px;
width:260px;
max-height:calc(100% - 92px);

}

width:30px;

color:#ddd;

#addFriendArea{

#addFriendInput{

margin-bottom:7px;

#addFriendButton{

.friend:hover{

/* =========================================================
REQUESTS
========================================================= */

#requestsPanel{
display:none;

top:78px;

.requests-header{

}

#closeRequestsButton{

height:30px;
border-radius:7px;
background:#29292d;
color:#ddd;
font-size:20px;
line-height:30px;
text-align:center;

}

}

#requestsList{

.request{
display:flex;
align-items:center;
justify-content:space-between;
gap:10px;
padding:10px 0;
border-bottom:1px solid #303035;
}

.request-nickname{

.request-actions{

}

.request-actions button{

.request-actions button[data-action="accept"]{

.request-actions button[data-action="accept"]:hover{

}

/* =========================================================
MODAL
========================================================= */

#modal p{

.choice{

.choice button{

color:#111;

.choice button:hover{

}

.modal-actions{
display:flex;
justify-content:flex-end;

.modal-actions button{
height:38px;

.modal-actions button:hover{

/* =========================================================
CONTEXT MENU
========================================================= */

#contextMenu{
display:none;

background:#171719;
border:1px solid #343438;

}

.context-option{

/* =========================================================
SCROLLBARS
========================================================= */

*{
scrollbar-width:thin;
scrollbar-color:#444 #171719;
}

::-webkit-scrollbar{

height:8px;
}

/* =========================================================
MOBILE
========================================================= */

}

}

#requestsPanel{

}

</style>

<body>

<script type="module">

import { createClient }
from "https://esm.sh/@supabase/supabase-js@2";


/* =========================================================
SUPABASE
========================================================= */

const SUPABASE_URL =
"https://uqpivlamfwbjoqvordcm.supabase.co";

const SUPABASE_KEY =
"sb_publishable_8CryzR2sR-y5nHprgLWJlA_Wfy_mTrj";

const supabase =
createClient(
SUPABASE_URL,
SUPABASE_KEY,
{
auth:{
persistSession:false,
autoRefreshToken:true,
detectSessionInUrl:true
}
}
);


/* =========================================================
STATE
========================================================= */

let user=null;
let currentProfile=null;

let profilesCache=new Map();

let boards=[];
let friends=[];

let selectedBoardId=null;
let contextBoardId=null;

let moving=null;
let resizing=null;
let panning=null;

let panX=80;
let panY=80;
let zoom=1;

let pointers=new Map();

let pinchStartDistance=null;
let pinchStartZoom=1;
let pinchStartCenter=null;
let pinchStartPanX=0;
let pinchStartPanY=0;


/* =========================================================
HELPERS
========================================================= */

function escapeHTML(value){

return String(value ?? "")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


function openModal(html){

document.getElementById("modal").innerHTML=html;

document.getElementById("modalBackground").style.display="flex";

}


function closeModal(){

document.getElementById("modalBackground").style.display="none";

}


window.closeModal=closeModal;


function showError(message){

alert(message);

}


/* =========================================================
AUTH MODE
========================================================= */

let signupMode=false;


function updateAuthUI(){

const description=
document.getElementById("authDescription");

const loginButton=
document.getElementById("loginButton");

const signupButton=
document.getElementById("signupButton");

const nickname=
document.getElementById("authNickname");

nickname.style.display="block";

nickname.required=false;


if(signupMode){

description.textContent=
"Create a new Spaceboards account.";

loginButton.style.display="none";

signupButton.textContent=
"Create account";

nickname.placeholder="Nickname";

}else{

description.textContent=
"Log in to Spaceboards.";

loginButton.style.display="inline-block";

signupButton.textContent=
"Create account";

nickname.placeholder="Nickname";

}

}


/* =========================================================
UPDATE PROFILE
========================================================= */

function updateProfileDisplay(){

const element=
document.getElementById("profileName");

if(!element)return;

element.textContent=
currentProfile?.nickname||
user?.email||
"";

}


/* =========================================================
LOGIN
========================================================= */

document.getElementById("loginButton")
.addEventListener(
"click",
async()=>{

const email=
document.getElementById("authEmail")
.value
.trim()
.toLowerCase();

const nickname=
document.getElementById("authNickname")
.value
.trim();

const password=
document.getElementById("authPassword")
.value;

const errorBox=
document.getElementById("authError");

errorBox.textContent="";


if(!email||!password){

errorBox.textContent=
"Enter your email and password.";

return;

}


const {
data,
error
}=
await supabase.auth.signInWithPassword({

email:email,

password:password

});


if(error){

errorBox.textContent=
error.message;

return;

}


user=data?.user||null;


if(!user){

errorBox.textContent=
"Login failed.";

return;

}


await loadCurrentProfile();


if(
nickname &&
currentProfile &&
(!currentProfile.nickname ||
currentProfile.nickname.trim()==="")
){

const {
data:updatedProfile,
error:updateError
}=
await supabase
.from("profiles")
.update({
nickname:nickname
})
.eq("id",user.id)
.select()
.maybeSingle();


if(!updateError&&updatedProfile){

currentProfile=updatedProfile;

profilesCache.set(
updatedProfile.id,
updatedProfile
);

}

}


await loadProfiles();
await loadFriends();
await loadBoards();
await loadFriendRequests();


document.getElementById("authScreen")
.style.display="none";


updateProfileDisplay();

render();
renderFriends();

});


/* =========================================================
CREATE ACCOUNT
========================================================= */

document.getElementById("signupButton")
.addEventListener(
"click",
async()=>{

if(!signupMode){

signupMode=true;

updateAuthUI();

return;

}


const email=
document.getElementById("authEmail")
.value
.trim()
.toLowerCase();

const nickname=
document.getElementById("authNickname")
.value
.trim();

const password=
document.getElementById("authPassword")
.value;

const errorBox=
document.getElementById("authError");

errorBox.textContent="";


if(!email||!nickname||!password){

errorBox.textContent=
"Enter your email, nickname and password.";

return;

}


if(nickname.length<2){

errorBox.textContent=
"Nickname must be at least 2 characters.";

return;

}


if(nickname.length>30){

errorBox.textContent=
"Nickname must be 30 characters or less.";

return;

}


if(password.length<6){

errorBox.textContent=
"Password must be at least 6 characters.";

return;

}


const {
data:existingNickname,
error:nicknameError
}=
await supabase
.from("profiles")
.select("id")
.ilike("nickname",nickname)
.limit(1)
.maybeSingle();


if(nicknameError){

console.error(
"Nickname check error:",
nicknameError
);

}


if(existingNickname){

errorBox.textContent=
"That nickname is already taken.";

return;

}


const {
data,
error
}=
await supabase.auth.signUp({

email:email,

password:password

});


if(error){

errorBox.textContent=
error.message;

return;

}


if(data?.user){

const {
data:profile,
error:profileError
}=
await supabase
.from("profiles")
.upsert({
id:data.user.id,
email:email,
nickname:nickname
},{
onConflict:"id"
})
.select()
.single();


if(profileError){

console.error(
"Profile creation error:",
profileError
);

errorBox.textContent=
"Account created, but the nickname could not be saved: "+
profileError.message;

return;

}


currentProfile=profile;

profilesCache.set(
data.user.id,
profile
);

updateProfileDisplay();

}


errorBox.textContent=
"Account created. Check your email if confirmation is required.";

});


/* =========================================================
AUTH KEYBOARD
========================================================= */

document.getElementById("authEmail")
.addEventListener(
"keydown",
event=>{

if(event.key==="Enter"){

document.getElementById("authNickname").focus();

}

});


document.getElementById("authNickname")
.addEventListener(
"keydown",
event=>{

if(event.key==="Enter"){

document.getElementById("authPassword").focus();

}

});


document.getElementById("authPassword")
.addEventListener(
"keydown",
event=>{

if(event.key==="Enter"){

if(signupMode){

document.getElementById("signupButton").click();

}else{

document.getElementById("loginButton").click();

}

}

});


/* =========================================================
SESSION
========================================================= */

supabase.auth.onAuthStateChange(
async(event,session)=>{

user=
session?.user||null;


if(user){

/* =========================================================
LOAD CURRENT PROFILE
========================================================= */

async function loadCurrentProfile(){

if(!user)return;


const {
data,
error
}=
await supabase
.from("profiles")
.select("id,email,nickname")
.eq("id",user.id)
.maybeSingle();


if(error){

console.error(
"Current profile error:",
error
);

return;

}


if(data){

currentProfile=data;

profilesCache.set(
String(data.id),
data
);

updateProfileDisplay();

return;

}


const fallbackNickname=
user.email?.split("@")[0]||
"User";


const {
data:newProfile,
error:newError
}=
await supabase
.from("profiles")
.upsert({
id:user.id,
email:user.email?.toLowerCase()||"",
nickname:fallbackNickname
},{
onConflict:"id"
})
.select()
.single();


if(!newError&&newProfile){

currentProfile=newProfile;

profilesCache.set(
String(newProfile.id),
newProfile
);

updateProfileDisplay();

}

}


/* =========================================================
LOAD PROFILES
========================================================= */

async function loadProfiles(){

if(!user)return;


const ownProfile=currentProfile;

profilesCache.clear();


if(ownProfile){

profilesCache.set(
String(ownProfile.id),
ownProfile
);

}


const {
data,
error
}=
await supabase
.from("profiles")
.select("id,email,nickname");


if(error){

console.error(
"Could not load profiles:",
error
);

return;

}


(data||[]).forEach(profile=>{

profilesCache.set(
String(profile.id),
profile
);

});

}


/* =========================================================
GET NICKNAME
========================================================= */

function getNickname(ownerId){

if(!ownerId)return "";


const profile=
profilesCache.get(
String(ownerId)
);


if(profile?.nickname){

return profile.nickname;

}


if(
currentProfile &&
String(currentProfile.id)===
String(ownerId)
){

return currentProfile.nickname||"";

}


return "";

}

/* =========================================================
FRIENDS
========================================================= */

async function loadFriends(){

if(!user)return;


const {
data,
error
}=
await supabase
.from("friend_requests")
.select("*")
.or(
`sender_id.eq.${user.id},receiver_id.eq.${user.id}`
);


if(error){

console.error(error);

return;

}


const accepted=
(data||[])
.filter(
r=>
r.status==="accepted"
);


const ids=
accepted.map(
r=>
r.sender_id===user.id
?r.receiver_id
:r.sender_id
);


if(!ids.length){

friends=[];

renderFriends();

return;

}


const {
data:friendProfiles,
error:profilesError
}=
await supabase
.from("profiles")
.select("id,email,nickname")
.in("id",ids);


if(profilesError){

console.error(profilesError);

return;

}


friends=
friendProfiles||[];


friends.forEach(friend=>{

profilesCache.set(
String(friend.id),
friend
);

});


renderFriends();

}

RENDER FRIENDS

ADD FRIEND

document.getElementById("addFriendButton")
.addEventListener(
"click",
async()=>{

const input=
document.getElementById("addFriendInput");

const email=
input.value
.trim()
.toLowerCase();


if(!email){

showError(
"Enter your friend's email."
);

return;

}


if(
user.email &&
email===user.email.toLowerCase()
){

showError(
"You cannot add yourself."
);

return;

}


const {
data:profile,
error
}=
await supabase
.from("profiles")
.select("id,email,nickname")
.eq("email",email)
.maybeSingle();


if(error){

showError(error.message);

return;

}


if(!profile){

showError(
"No user with that email was found."
);

return;

}


if(profile.id===user.id){

showError(
"You cannot add yourself."
);

return;

}


profilesCache.set(
String(profile.id),
profile
);


const {
data:existing,
error:existingError
}=
await supabase
.from("friend_requests")
.select("id,status")
.or(
`and(sender_id.eq.${user.id},receiver_id.eq.${profile.id}),and(sender_id.eq.${profile.id},receiver_id.eq.${user.id})`
);


if(existingError){

showError(existingError.message);

return;

}


if(existing&&existing.length){

if(
existing.some(
request=>
request.status==="accepted"
)
){

showError(
"You are already friends with this user."
);

return;

}


if(
existing.some(
request=>
request.status==="pending"
)
){

showError(
"A friend request already exists."
);

return;

}

}


const {
error:insertError
}=
await supabase
.from("friend_requests")
.insert({
sender_id:user.id,
receiver_id:profile.id,
status:"pending"
});


if(insertError){

showError(insertError.message);

return;

}


input.value="";


showError(
"Friend request sent."
);

});

error
}=

.from("friend_requests")
.select("*")
.eq("receiver_id",user.id)
.eq("status","pending");

list.innerHTML=
`<div style="color:#ff6666">

</div>`;

!requests ||
requests.length===0
){

requests.map(
request=>
request.sender_id
);

}=

.from("profiles")
.select("id,email,nickname")
.in("id",ids);

profile
);

(requestProfiles||[])
.find(
profile=>
String(profile.id)===
String(request.sender_id)
);

document.createElement("div");

)}

Accept
</button>

data-action="decline"

Decline

});

}

/* =========================================================
SAVE URL
========================================================= */

async function saveURL(
board,
visibility
){

let url=
document.getElementById("urlAddress")
.value
.trim();


const title=
document.getElementById("urlTitle")
.value
.trim();

const image=
document.getElementById("urlImage")
.value
.trim();


if(!url){

showError("Enter a URL.");

return;

}


if(!/^https?:\/\//i.test(url)){

url="https://"+url;

}


await loadCurrentProfile();


const ownerNickname=
currentProfile?.nickname||
getNickname(board.owner_id)||
"";


const insertData={

box_id:board.id,

title:title||url,

url:url,

image:image||null,

visibility:visibility,

owner_nickname:ownerNickname

};


let {
data,
error
}=
await supabase
.from("box_items")
.insert(insertData)
.select()
.single();


if(
error &&
(
error.code==="42703" ||
String(error.message)
.toLowerCase()
.includes("owner_nickname")
)
){

const fallback=
await supabase
.from("box_items")
.insert({
box_id:board.id,
title:title||url,
url:url,
image:image||null,
visibility:visibility
})
.select()
.single();


data=fallback.data;
error=fallback.error;

}


if(error){

showError(
"Could not save URL: "+
error.message
);

return;

}


if(!data){

showError(
"Could not save URL."
);

return;

}


data.owner_nickname=
ownerNickname;


board.ownerNickname=
ownerNickname||
board.ownerNickname||
"";


board.items.push(data);


closeModal();

render();

}


/* =========================================================
DELETE URL
========================================================= */

async function deleteURL(
board,
itemId
){

if(!confirm("Delete this URL?"))return;


const {
error
}=
await supabase
.from("box_items")
.delete()
.eq("id",itemId)
.eq("box_id",board.id);


if(error){

showError(
"Could not delete URL: "+
error.message
);

return;

}


board.items=
board.items.filter(
item=>
String(item.id)!==
String(itemId)
);


render();

}


/* =========================================================
DELETE BOX
========================================================= */

async function deleteBoard(board){

if(!user){

showError(
"You must be logged in."
);

return;

}


if(
String(board.owner_id)!==
String(user.id)
){

showError(
"You can only delete your own boxes."
);

return;

}


if(!confirm(
"Delete this box and all of its URLs?"
))return;


const {
error:itemError
}=
await supabase
.from("box_items")
.delete()
.eq("box_id",board.id);


if(itemError){

showError(
"Could not delete the URLs in this box: "+
itemError.message
);

return;

}


const {
data:deleted,
error:boxError
}=
await supabase
.from("boxes")
.delete()
.eq("id",board.id)
.eq("owner_id",user.id)
.select();


if(boxError){

showError(
"Could not delete box: "+
boxError.message
);

return;

}


if(
!deleted ||
deleted.length===0
){

showError(
"Supabase did not allow this box to be deleted. Check the DELETE policy for the boxes table."
);

return;

}


boards=
boards.filter(
b=>
String(b.id)!==
String(board.id)
);


if(
String(selectedBoardId)===
String(board.id)
){

selectedBoardId=null;

}


render();

}

========================================================= */

function render(){

document.getElementById("world");


world.style.transform=
`translate(${panX}px,${panY}px) scale(${zoom})`;


world.innerHTML="";


if(!user)return;


boards.forEach(board=>{

document.createElement("section");


element.className=

(
String(selectedBoardId)===
String(board.id)
?" selected"
:""
);

board.id;

Number(board.x)+"px";

element.style.top=
Number(board.y)+"px";

element.style.width=
Number(board.w)+"px";

element.style.height=
Number(board.h)+"px";


const owner=
String(board.owner_id)===
String(user?.id);


let boardNickname=
board.ownerNickname||
"";


if(
owner &&
currentProfile?.nickname
){

boardNickname=
currentProfile.nickname;

}


if(!boardNickname){

boardNickname=
getNickname(board.owner_id)||"";

}


element.innerHTML=`

<div class="board-title">
${escapeHTML(board.title)}
</div>

${
owner
?
`
<div class="board-actions">

<button
class="trash-button"
title="Delete box"
data-delete-board="${escapeHTML(board.id)}"
>
×
</button>

</div>
`
:""
}

<div class="board-inner">

${
owner
?
`
<button
class="add-url"
data-add-url="${escapeHTML(board.id)}"
>
+ Add URL
</button>
`
:""
}

${
board.items.map(item=>{

const itemNickname=
item.owner_nickname||
boardNickname||
"";


return `

<div
class="item"
data-item-id="${escapeHTML(item.id)}"
data-url="${escapeHTML(item.url)}"
>

${
item.image
?
`
<img
src="${escapeHTML(item.image)}"
alt=""
onerror="this.style.display='none'"
>
`
:""
}

<div class="item-content">

<div class="item-nickname">
${escapeHTML(itemNickname)}
</div>

<div class="item-title">
${escapeHTML(item.title||item.url)}
</div>

</div>

<span class="item-visibility">
${item.visibility==="public"?"Public":"Private"}
</span>

${
owner
?
`
<button
class="item-trash"
title="Delete URL"
data-delete-item="${escapeHTML(item.id)}"
>
×
</button>
`
:""
}

</div>

`;

}).join("")
}

</div>

${
owner
?
`
<div class="resize"></div>
`
:""
}

`;

/* MOVE + RESIZE */

if(owner){

element.addEventListener(
"pointerdown",
event=>{

if(event.pointerType==="touch")return;

if(event.target.closest(".item"))return;
if(event.target.closest(".add-url"))return;
if(event.target.closest(".trash-button"))return;


if(event.target.closest(".resize")){

resizing={

id:board.id,

startX:event.clientX,

startY:event.clientY,

width:board.w,

height:board.h

};


element.setPointerCapture(
event.pointerId
);

event.preventDefault();

return;

}


moving={

id:board.id,

startX:event.clientX,

startY:event.clientY,

x:board.x,

y:board.y

};


element.setPointerCapture(
event.pointerId
);

event.preventDefault();

});


element.addEventListener(
"pointermove",
event=>{

if(
resizing &&
resizing.id===board.id
){

board.w=
Math.max(
180,
resizing.width+
(
event.clientX-
resizing.startX
)/zoom
);

board.h=
Math.max(
120,
resizing.height+
(
event.clientY-
resizing.startY
)/zoom
);


element.style.width=
board.w+"px";

element.style.height=
board.h+"px";


return;

}


if(
moving &&
moving.id===board.id
){

board.x=
moving.x+
(
event.clientX-
moving.startX
)/zoom;

board.y=
moving.y+
(
event.clientY-
moving.startY
)/zoom;


element.style.left=
board.x+"px";

element.style.top=
board.y+"px";

}

});


element.addEventListener(
"pointerup",
async event=>{

if(
moving &&
moving.id===board.id
){

const finalX=board.x;
const finalY=board.y;

moving=null;


const {
error
}=
await supabase
.from("boxes")
.update({
x:finalX,
y:finalY
})
.eq("id",board.id)
.eq("owner_id",user.id);


if(error){

console.error(
"Move save error:",
error
);

}

}


if(
resizing &&
resizing.id===board.id
){

const finalWidth=board.w;
const finalHeight=board.h;

resizing=null;


const {
error
}=
await supabase
.from("boxes")
.update({
width:finalWidth,
height:finalHeight
})
.eq("id",board.id)
.eq("owner_id",user.id);


if(error){

console.error(
"Resize save error:",
error
);

}

}

});


element.addEventListener(
"pointercancel",
()=>{

moving=null;
resizing=null;

});

}


world.appendChild(element);

});

}


/* =========================================================
DESKTOP PAN
========================================================= */

const workspace=
document.getElementById("workspace");


workspace.addEventListener(
"pointerdown",
event=>{

if(event.pointerType==="touch")return;

if(event.target.closest(".board"))return;

if(event.target.closest("button"))return;

panning={

x:event.clientX,
y:event.clientY,

panX:panX,
panY:panY

};

workspace.setPointerCapture?.(
event.pointerId
);

});


workspace.addEventListener(
"pointermove",
event=>{

if(!panning)return;


panX=
panning.panX+
event.clientX-
panning.x;

panY=
panning.panY+
event.clientY-
panning.y;


document.getElementById("world").style.transform=
`translate(${panX}px,${panY}px) scale(${zoom})`;

});


workspace.addEventListener(
"pointerup",
()=>{
panning=null;
});


workspace.addEventListener(
"pointercancel",
()=>{
panning=null;
});


/* =========================================================
TOUCH PAN + PINCH
========================================================= */

function distance(a,b){

return Math.hypot(
a.clientX-b.clientX,
a.clientY-b.clientY
);

}


function midpoint(a,b){

return{

x:(a.clientX+b.clientX)/2,

y:(a.clientY+b.clientY)/2

};

}


workspace.addEventListener(
"pointerdown",
event=>{

if(event.pointerType!=="touch")return;


pointers.set(
event.pointerId,
{
clientX:event.clientX,
clientY:event.clientY
}
);


if(pointers.size===1){

if(!event.target.closest(".board")){

panning={

x:event.clientX,
y:event.clientY,

panX:panX,
panY:panY

};

}

}


if(pointers.size===2){

panning=null;


const points=
[...pointers.values()];


pinchStartDistance=
distance(
points[0],
points[1]
);

pinchStartZoom=zoom;

pinchStartCenter=
midpoint(
points[0],
points[1]
);

pinchStartPanX=panX;
pinchStartPanY=panY;

}

});


workspace.addEventListener(
"pointermove",
event=>{

if(event.pointerType!=="touch")return;

if(!pointers.has(event.pointerId))return;


pointers.set(
event.pointerId,
{
clientX:event.clientX,
clientY:event.clientY
}
);


if(
pointers.size===1 &&
panning
){

panX=
panning.panX+
event.clientX-
panning.x;

panY=
panning.panY+
event.clientY-
panning.y;


document.getElementById("world").style.transform=
`translate(${panX}px,${panY}px) scale(${zoom})`;

return;

}


if(pointers.size===2){

const points=
[...pointers.values()];


const currentDistance=
distance(
points[0],
points[1]
);


if(!pinchStartDistance)return;


let newZoom=
pinchStartZoom*
(
currentDistance/
pinchStartDistance
);


newZoom=
Math.max(
0.25,
Math.min(
3,
newZoom
)
);


const center=
midpoint(
points[0],
points[1]
);


const rect=
workspace.getBoundingClientRect();


const worldX=
(
pinchStartCenter.x-
rect.left-
pinchStartPanX
)/
pinchStartZoom;


const worldY=
(
pinchStartCenter.y-
rect.top-
pinchStartPanY
)/
pinchStartZoom;


panX=
center.x-
rect.left-
worldX*newZoom;


panY=
center.y-
rect.top-
worldY*newZoom;


zoom=newZoom;


document.getElementById("world").style.transform=
`translate(${panX}px,${panY}px) scale(${zoom})`;

}

});


function endTouch(event){

if(event.pointerType!=="touch")return;


pointers.delete(
event.pointerId
);


if(pointers.size<2){

pinchStartDistance=null;

}


if(pointers.size===0){

panning=null;

}

}


workspace.addEventListener(
"pointerup",
endTouch
);

workspace.addEventListener(
"pointercancel",
endTouch
);


/* =========================================================
MOUSE WHEEL ZOOM
========================================================= */

workspace.addEventListener(
"wheel",
event=>{

event.preventDefault();


const rect=
workspace.getBoundingClientRect();


const mouseX=
event.clientX-
rect.left;

const mouseY=
event.clientY-
rect.top;


const worldX=
(mouseX-panX)/
zoom;

const worldY=
(mouseY-panY)/
zoom;


const factor=
event.deltaY<0
?1.1
:0.9;


zoom=
Math.max(
0.25,
Math.min(
3,
zoom*factor
)
);


panX=
mouseX-
worldX*zoom;

panY=
mouseY-
worldY*zoom;


document.getElementById("world").style.transform=
`translate(${panX}px,${panY}px) scale(${zoom})`;

},
{
passive:false
}
);

document.getElementById("renameOption")
.addEventListener(
"click",
async()=>{

document.getElementById("contextMenu")
.style.display="none";


const board=
boards.find(
b=>
String(b.id)===
String(contextBoardId)
);


if(!board)return;


if(
String(board.owner_id)!==
String(user.id)
){

showError(
"You can only rename your own boxes."
);

return;

}


openModal(`

<h2>Rename box</h2>

<input
id="renameInput"
value="${escapeHTML(board.title)}"
>

<div class="modal-actions">

<button id="renameCancel">
Cancel
</button>

<button id="renameSave">
Save
</button>

</div>

`);


document.getElementById("renameCancel")
.onclick=closeModal;


document.getElementById("renameSave")
.onclick=
async()=>{

const title=
document.getElementById("renameInput")
.value
.trim();


if(!title)return;


const {
error
}=
await supabase
.from("boxes")
.update({
title:title
})
.eq("id",board.id)
.eq("owner_id",user.id);


if(error){

showError(error.message);

return;

}


board.title=title;

closeModal();

render();

};

});

/* =========================================================
SEARCH
========================================================= */

document.getElementById("searchInput")
.addEventListener(
"input",
event=>{

const query=
event.target.value
.toLowerCase()
.trim();


document
.querySelectorAll(".board")
.forEach(element=>{

const board=
boards.find(
b=>
String(b.id)===
String(element.dataset.id)
);


if(!board)return;


const matches=
!query||

String(board.title||"")
.toLowerCase()
.includes(query)||

board.items.some(
item=>

String(item.title||"")
.toLowerCase()
.includes(query)||

String(item.url||"")
.toLowerCase()
.includes(query)

);


element.style.opacity=
matches
?"1"
:"0.2";

});

});

);

);

);

}

}
