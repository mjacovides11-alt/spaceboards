<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spaceboards - Supabase Test</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 40px 20px;
      text-align: center;
    }
    .box {
      max-width: 600px;
      margin: 40px auto;
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.1);
    }
    h1 {
      margin-top: 0;
    }
    #status {
      margin-top: 25px;
      padding: 15px;
      border-radius: 8px;
      font-weight: bold;
    }
    .testing {
      background: #eee;
      color: #333;
    }
    .success {
      background: #d9f7df;
      color: #176b2c;
    }
    .error {
      background: #ffdede;
      color: #a00000;
    }
    pre {
      text-align: left;
      white-space: pre-wrap;
      word-break: break-word;
      background: #f0f0f0;
      padding: 15px;
      border-radius: 8px;
      margin-top: 15px;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>Spaceboards</h1>
    <p>Testing Supabase connection...</p>
    <div id="status" class="testing">
      Connecting to Supabase...
    </div>
    <pre id="details"></pre>
  </div>
  <script type="module">
    import { createClient }
    from "https://esm.sh/@supabase/supabase-js@2";
    /* =========================================================
       SUPABASE
       ========================================================= */
    const SUPABASE_URL =
      "https://uqpivlamfwbjoqvordcm.supabase.co";
    const SUPABASE_KEY =
      "sb_publishable_8CryzR2sR-y5nHprgLWJlA_Wfy_mTrj";
    /* =========================================================
       CREATE CLIENT
       ========================================================= */
    const supabase =
      createClient(
        SUPABASE_URL,
        SUPABASE_KEY,
        {
          auth: {
            persistSession: false,
            autoRefreshToken: true,
            detectSessionInUrl: true
          }
        }
      );
    /* =========================================================
       TEST
       ========================================================= */
    const status =
      document.getElementById("status");
    const details =
      document.getElementById("details");
    try {
      const {
        data,
        error
      } =
        await supabase.auth.getSession();
      console.log(
        "Supabase test:",
        data,
        error
      );
      if (error) {
        status.className = "error";
        status.textContent =
          "SUPABASE ERROR";
        details.textContent =
          "Error message:\n" +
          error.message +
          "\n\nError details:\n" +
          JSON.stringify(
            error,
            null,
            2
          );
      } else {
        status.className = "success";
        status.textContent =
          "SUPABASE CONNECTION WORKS";
        details.textContent =
          "The Supabase URL and API key were accepted.\n\n" +
          "Your authentication connection is working.";
      }
    } catch (error) {
      console.error(error);
      status.className = "error";
      status.textContent =
        "CONNECTION FAILED";
      details.textContent =
        "JavaScript error:\n" +
        error.message;
    }
  </script>
</body>
</html>
