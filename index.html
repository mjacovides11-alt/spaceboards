<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>Spaceboards</title>

<style>
*{
  box-sizing:border-box;
}

:root{
  --accent:#6c8cff;
  --accent-hover:#5678ee;
}


html,
body{
  margin:0;
  width:100%;
  height:100%;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  overflow:hidden;
  background:#0d0d11;
  color:#e8e8e8;
}


button,
input{
  font-family:inherit;
}

button{
  cursor:pointer;
  border:0;
}

.hidden{
  display:none!important;
}

/* =========================================================
AUTH
========================================================= */

#authScreen{
  position:fixed;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#0b0b0d;
  z-index:10000;
}

.auth-card{
  width:min(420px,calc(100% - 30px));
  background:#161618;
  border:1px solid #29292d;
  border-radius:18px;
  padding:32px;
  box-shadow:0 15px 50px rgba(0,0,0,.65);
}

.auth-card h1{
  margin:0 0 8px;
  font-size:30px;
  color:#f5f5f5;
}

.auth-description{
  margin:0 0 24px;
  color:#999;
  font-size:15px;
}

.auth-card input{
  display:block;
  width:100%;
  height:46px;
  margin-bottom:12px;
  padding:0 14px;
  border:1px solid #343438;
  border-radius:9px;
  font-size:15px;
  outline:none;
  background:#0f0f11;
  color:#eee;
}

.auth-card input::placeholder{
  color:#666;
}

.auth-card input:focus{
  border-color:#777;
}

.auth-buttons{
  display:flex;
  gap:10px;
  margin-top:8px;
}

.auth-buttons button{
  flex:1;
  height:46px;
  border-radius:9px;
  font-weight:600;
}

#loginButton{
  background:#eeeeee;
  color:#111;
}

#loginButton:hover{
  background:#d5d5d5;
}

#signupButton{
  background:#29292d;
  color:#eee;
}

#signupButton:hover{
  background:#38383d;
}

.auth-error{
  min-height:20px;
  margin-top:14px;
  font-size:13px;
  color:#ff6666;
}

/* =========================================================
TOP BAR
========================================================= */

#app{
  position:fixed;
  inset:0;
  display:flex;
  flex-direction:column;
}

#topbar{
  height:64px;
  background:#111113;
  border-bottom:1px solid #29292d;
  display:flex;
  align-items:center;
  gap:10px;
  padding:0 14px;
  z-index:500;
  flex-shrink:0;
}

.logo{
  font-size:21px;
  font-weight:800;
  margin-right:8px;
  white-space:nowrap;
  color:#f2f2f2;
}

#searchInput{
  height:40px;
  width:240px;
  max-width:30vw;
  border:1px solid #36363b;
  border-radius:9px;
  padding:0 13px;
  outline:none;
  background:#1a1a1d;
  color:#eee;
}

#searchInput::placeholder{
  color:#666;
}

#searchInput:focus{
  border-color:#777;
}

.top-button{
  height:40px;
  padding:0 14px;
  border-radius:9px;
  background:#29292d;
  color:#ddd;
  font-weight:600;
  white-space:nowrap;
}

.top-button:hover{
  background:#39393e;
}

#newBoxButton{
  background:var(--accent);
  color:#fff;
}

#newBoxButton:hover{
  background:var(--accent-hover);
}


.spacer{
  flex:1;
}

#profileName{
  font-size:14px;
  color:#aaa;
  max-width:180px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

/* =========================================================
WORKSPACE
========================================================= */

#workspace{
  position:relative;
  flex:1;
  overflow:hidden;
  touch-action:none;
  background-color:#0d0d11;
  background-image:
    radial-gradient(#2a2a30 1px,transparent 1px);
  background-size:28px 28px;
}


#world{
  position:absolute;
  left:0;
  top:0;
  width:1px;
  height:1px;
  transform-origin:0 0;
}

/* =========================================================
BOARDS
========================================================= */

.board{
  position:absolute;
  background:#171719;
  border:1px solid #cfcfd4;
  border-radius:14px;
  box-shadow:0 8px 30px rgba(0,0,0,.55);
  overflow:visible;
  user-select:none;
  touch-action:none;
}

.board.selected{
  border:2px solid var(--accent);
  box-shadow:0 0 0 3px rgba(108,140,255,.15);
}


.board-title{
  position:absolute;
  left:0;
  top:-38px;
  font-size:16px;
  font-weight:700;
  white-space:nowrap;
  max-width:350px;
  overflow:hidden;
  text-overflow:ellipsis;
  color:#ddd;
  cursor:text;
}

.board-actions{
  position:absolute;
  right:8px;
  top:8px;
  z-index:20;
}

.trash-button,
.item-trash{
  width:30px;
  height:30px;
  border-radius:7px;
  background:#29292d;
  color:#ddd;
  font-size:14px;
}

.trash-button:hover,
.item-trash:hover{
  background:#492929;
  color:#ff7777;
}

.board-inner{
  position:absolute;
  inset:14px;
  overflow:auto;
  padding-top:2px;
}

.add-url{
  width:100%;
  height:38px;
  border-radius:8px;
  background:#e8e8e8;
  color:#111;
  font-weight:600;
  margin-bottom:10px;
}

.add-url:hover{
  background:#ccc;
}

.empty-state{
  padding:24px 10px;
  text-align:center;
  font-size:13px;
  color:#aaa;
  border:1px dashed #555;
  border-radius:10px;
  background:#1c1c1f;
}



/* =========================================================
ITEMS
========================================================= */

.item{
  position:relative;
  display:flex;
  align-items:center;
  gap:12px;
  min-height:64px;
  padding:10px 42px 10px 10px;
  margin-bottom:10px;
  border:1px solid #343438;
  border-radius:10px;
  background:#202023;
  color:#eee;
  cursor:pointer;
  transition:background .15s ease,transform .15s ease,box-shadow .15s ease;
}

.item:hover{
  background:#26262a;
  transform:translateY(-2px);
  box-shadow:0 6px 16px rgba(0,0,0,.35);
}

.item img{
  width:52px;
  height:52px;
  object-fit:cover;
  border-radius:8px;
  flex-shrink:0;
}


.item-content{
  min-width:0;
  flex:1;
}

.item-nickname{
  font-size:11px;
  color:#888;
  margin-bottom:2px;
}

.item-title{
  font-size:14px;
  font-weight:600;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  color:#eee;
}

.item-visibility{
  position:absolute;
  right:8px;
  top:7px;
  font-size:9px;
  color:#888;
}

.item-trash{
  position:absolute;
  right:7px;
  bottom:7px;
  width:25px;
  height:25px;
  font-size:11px;
}

/* =========================================================
RESIZE
========================================================= */

.resize{
  position:absolute;
  right:0;
  bottom:0;
  width:22px;
  height:22px;
  cursor:nwse-resize;
  z-index:30;
}

.resize::after{
  content:"";
  position:absolute;
  right:5px;
  bottom:5px;
  width:10px;
  height:10px;
  border-right:2px solid #777;
  border-bottom:2px solid #777;
}

/* =========================================================
FRIENDS
========================================================= */

#friendsPanel{
  display:none;
  position:absolute;
  right:14px;
  top:78px;
  width:260px;
  max-height:calc(100% - 92px);
  background:#171719;
  border:1px solid #343438;
  border-radius:12px;
  box-shadow:0 10px 35px rgba(0,0,0,.6);
  z-index:400;
  overflow:hidden;
}


.friends-header,
.requests-header{
  padding:14px;
  font-weight:700;
  border-bottom:1px solid #303035;
  display:flex;
  align-items:center;
  justify-content:space-between;
  color:#eee;
}

#closeFriendsButton,
#closeRequestsButton{
  width:30px;
  height:30px;
  border-radius:7px;
  background:#29292d;
  color:#ddd;
  font-size:20px;
  line-height:30px;
  text-align:center;
  padding:0;
}

#closeFriendsButton:hover,
#closeRequestsButton:hover{
  background:#3a3a3f;
}

#addFriendArea{
  padding:10px;
  border-bottom:1px solid #303035;
}

#addFriendInput{
  width:100%;
  height:38px;
  border:1px solid #35353a;
  border-radius:8px;
  padding:0 10px;
  margin-bottom:7px;
  background:#0f0f11;
  color:#eee;
  outline:none;
}

#addFriendButton{
  width:100%;
  height:36px;
  border-radius:8px;
  background:#e8e8e8;
  color:#111;
  font-weight:600;
}

#friendsList{
  padding:8px;
  max-height:180px;
  overflow:auto;
}

.friend{
  padding:9px;
  border-radius:7px;
  font-size:14px;
  color:#ddd;
}

.friend:hover{
  background:#29292d;
}

/* =========================================================
REQUESTS
========================================================= */

#requestsPanel{
  display:none;
  position:absolute;
  right:14px;
  top:78px;
  width:300px;
  max-height:calc(100% - 92px);
  overflow:auto;
  background:#171719;
  border:1px solid #343438;
  border-radius:12px;
  box-shadow:0 10px 35px rgba(0,0,0,.6);
  z-index:450;
}

#requestsList{
  padding:10px;
}

.request{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:10px 0;
  border-bottom:1px solid #303035;
}

.request-nickname{
  font-weight:600;
  font-size:14px;
  overflow:hidden;
  text-overflow:ellipsis;
  color:#ddd;
}

.request-actions{
  display:flex;
  gap:5px;
}

.request-actions button{
  padding:6px 8px;
  border-radius:6px;
  font-size:12px;
}

.request-actions button[data-action="accept"]{
  background:#e8e8e8;
  color:#111;
}

.request-actions button[data-action="decline"]{
  background:#29292d;
  color:#ddd;
}

/* =========================================================
MODAL
========================================================= */

#modalBackground{
  position:fixed;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  background:rgba(0,0,0,.78);
  z-index:9000;
}

#modal{
  width:min(430px,calc(100% - 30px));
  background:#171719;
  border:1px solid #343438;
  border-radius:15px;
  padding:24px;
  box-shadow:0 20px 60px rgba(0,0,0,.7);
}

#modal h2{
  margin:0 0 18px;
  color:#eee;
}

#modal input{
  width:100%;
  height:44px;
  margin-bottom:10px;
  padding:0 12px;
  border:1px solid #35353a;
  border-radius:8px;
  outline:none;
  background:#0f0f11;
  color:#eee;
}

#modal input:focus{
  border-color:#777;
}

#modal p{
  font-size:14px;
  color:#999;
}

.choice{
  display:flex;
  gap:8px;
  margin-bottom:15px;
}

.choice button{
  flex:1;
  height:40px;
  border-radius:8px;
  background:#e8e8e8;
  color:#111;
  font-weight:600;
}

.modal-actions{
  display:flex;
  justify-content:flex-end;
  gap:8px;
  margin-top:16px;
}

.modal-actions button{
  height:38px;
  padding:0 14px;
  border-radius:8px;
  background:#29292d;
  color:#ddd;
  font-weight:600;
}

.modal-actions button:last-child{
  background:#e8e8e8;
  color:#111;
}

/* =========================================================
CONTEXT MENU
========================================================= */

#contextMenu{
  display:none;
  position:fixed;
  width:150px;
  background:#171719;
  border:1px solid #343438;
  border-radius:9px;
  box-shadow:0 10px 30px rgba(0,0,0,.6);
  overflow:hidden;
  z-index:9500;
}

.context-option{
  width:100%;
  height:42px;
  text-align:left;
  padding:0 13px;
  background:#171719;
  color:#ddd;
}

.context-option:hover{
  background:#29292d;
}

/* =========================================================
SCROLLBARS
========================================================= */

*{
  scrollbar-width:thin;
  scrollbar-color:#444 #171719;
}

::-webkit-scrollbar{
  width:8px;
  height:8px;
}

::-webkit-scrollbar-track{
  background:#171719;
}

::-webkit-scrollbar-thumb{
  background:#444;
  border-radius:10px;
}

/* =========================================================
MOBILE
========================================================= */

@media(max-width:700px){

  #topbar{
    height:auto;
    min-height:60px;
    padding:10px;
    flex-wrap:wrap;
  }

  .logo{
    width:100%;
  }

  #searchInput{
    max-width:none;
    width:100%;
    order:5;
  }

  #profileName{
    display:none;
  }

  .top-button{
    padding:0 10px;
  }

  #friendsPanel,
  #requestsPanel{
    top:120px;
    right:10px;
    width:calc(100% - 20px);
  }

  .board-title{
    font-size:14px;
  }
}

#app.mobile-list #world{
  position:relative;
  transform:none!important;
  display:flex;
  flex-direction:column;
  gap:56px;
  padding:60px 14px 40px;
  width:100%;
}


#app.mobile-list #workspace{
  overflow-y:auto;
}

#app.mobile-list .board{
  position:relative!important;
  left:auto!important;
  top:auto!important;
  width:100%!important;
  height:auto!important;
  min-height:220px;
}

#app.mobile-list .resize{
  display:none;
}



</style>
</head>

<body>

<!-- =========================================================
AUTH SCREEN
========================================================= -->

<div id="authScreen">

  <div class="auth-card">

    <h1>Spaceboards</h1>

    <p id="authDescription" class="auth-description">
      Log in to Spaceboards.
    </p>

    <input
      id="authEmail"
      type="email"
      placeholder="Email"
      autocomplete="email"
    >

    <input
      id="authNickname"
      type="text"
      placeholder="Nickname"
      autocomplete="nickname"
    >

     <input
      id="authPassword"
      type="password"
      placeholder="Password"
      autocomplete="current-password"
    >

    <label style="display:flex;align-items:center;gap:8px;color:#aaa;font-size:14px;margin-bottom:14px;">
      <input
        id="rememberMeCheckbox"
        type="checkbox"
        checked
        style="width:16px;height:16px;"
      >
      Remember me
    </label>

    <div class="auth-buttons">


      <button id="loginButton">
        Log in
      </button>

      <button id="signupButton">
        Create account
      </button>

    </div>

    <div id="authError" class="auth-error"></div>

  </div>

</div>

<!-- =========================================================
APP
========================================================= -->

<div id="app">

  <div id="topbar">

    <div class="logo">
      Spaceboards
    </div>

    <input
      id="searchInput"
      type="text"
      placeholder="Search..."
    >

    <button
      id="newBoxButton"
      class="top-button"
      type="button"
    >
      New box
    </button>

       <button
      id="addFriendsPanelButton"
      class="top-button"
      type="button"
    >
      Add Friends
    </button>


    <button
      id="friendRequestsButton"
      class="top-button"
      type="button"
    >
      Requests
    </button>

    <button
      id="shareButton"
      class="top-button"
      type="button"
    >
      Share
    </button>

    <div class="spacer"></div>

    <div id="profileName"></div>

    <button
      id="logoutButton"
      class="top-button"
      type="button"
    >
      Log out
    </button>

  </div>

  <div id="workspace">

    <div id="world"></div>

    <div id="friendsPanel">

      <div class="friends-header">

        <span>Friends</span>

        <button
          id="closeFriendsButton"
          type="button"
        >
          ×
        </button>

      </div>

      <div id="addFriendArea">

        <input
          id="addFriendInput"
          type="email"
          placeholder="Friend's email"
        >

        <button
          id="addFriendButton"
          type="button"
        >
          Add friend
        </button>

      </div>

      <div id="friendsList"></div>

    </div>

    <div id="requestsPanel">

      <div class="requests-header">

        <span>Friend requests</span>

        <button
          id="closeRequestsButton"
          type="button"
        >
          ×
        </button>

      </div>

      <div id="requestsList"></div>

    </div>

  </div>

</div>

<!-- =========================================================
CONTEXT MENU
========================================================= -->

<div id="contextMenu">

  <button
    id="renameOption"
    class="context-option"
    type="button"
  >
    Rename
  </button>

  <button
    id="deleteOption"
    class="context-option"
    type="button"
  >
    Delete
  </button>

</div>

<!-- =========================================================
MODAL
========================================================= -->

<div id="modalBackground">

  <div id="modal"></div>

</div>

<script type="module">

import {
  createClient
} from "https://esm.sh/@supabase/supabase-js@2";

/* =========================================================
SUPABASE
========================================================= */

const SUPABASE_URL =
  "https://uqpivlamfwbjoqvordcm.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_8CryzR2sR-y5nHprgLWJlA_Wfy_mTrj";

function getAuthStorage(){

  return localStorage.getItem("spaceboards_remember") === "false"
    ? sessionStorage
    : localStorage;

}

const customAuthStorage = {

  getItem:(key)=> getAuthStorage().getItem(key),

  setItem:(key,value)=> getAuthStorage().setItem(key,value),

  removeItem:(key)=> getAuthStorage().removeItem(key)

};

const supabase =
  createClient(
    SUPABASE_URL,
    SUPABASE_KEY,
    {
      auth:{
        persistSession:true,
        autoRefreshToken:true,
        detectSessionInUrl:true,
        storage:customAuthStorage
      }
    }
  );



/* =========================================================
STATE
========================================================= */

let user = null;
let currentProfile = null;

let profilesCache = new Map();

let boards = [];
let friends = [];

let selectedBoardId = null;
let contextBoardId = null;

let moving = null;
let resizing = null;
let panning = null;

let panX = 80;
let panY = 80;
let zoom = 1;

let mobileListMode = false;
let mobileModeAsked = false;

let pointers = new Map();

let pinchStartDistance = null;
let pinchStartZoom = 1;
let pinchStartCenter = null;
let pinchStartPanX = 0;
let pinchStartPanY = 0;

/* =========================================================
HELPERS
========================================================= */

function escapeHTML(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}

function openModal(html){

  document.getElementById("modal").innerHTML = html;

  document.getElementById("modalBackground").style.display = "flex";

}

function closeModal(){

  document.getElementById("modalBackground").style.display = "none";

}

function showError(message){

  alert(String(message));

}

function maybeAskMobileMode(){

  if(mobileModeAsked)return;

  mobileModeAsked = true;

  openModal(`

    <h2>Mobile device?</h2>

    <p>
      Are you using Spaceboards on a mobile phone?
    </p>

    <div class="choice">

      <button id="mobileYesButton" type="button">
        Yes
      </button>

      <button id="mobileNoButton" type="button">
        No
      </button>

    </div>

  `);

  document
    .getElementById("mobileYesButton")
    .onclick = ()=>{

      mobileListMode = true;

      document.getElementById("app")
        .classList.add("mobile-list");

      closeModal();

      render();

    };

  document
    .getElementById("mobileNoButton")
    .onclick = ()=>{

      mobileListMode = false;

      document.getElementById("app")
        .classList.remove("mobile-list");

      closeModal();

      render();

    };

}


/* =========================================================
AUTH
========================================================= */

let signupMode = false;

function updateAuthUI(){

  const description =
    document.getElementById("authDescription");

  const loginButton =
    document.getElementById("loginButton");

  const signupButton =
    document.getElementById("signupButton");

  const nickname =
    document.getElementById("authNickname");

  if(signupMode){

    description.textContent =
      "Create a new Spaceboards account.";

    loginButton.style.display =
      "none";

    signupButton.textContent =
      "Create account";

    nickname.style.display =
      "block";

  }else{

    description.textContent =
      "Log in to Spaceboards.";

    loginButton.style.display =
      "inline-block";

    signupButton.textContent =
      "Create account";

    nickname.style.display =
      "block";

  }

}

/* =========================================================
PROFILE
========================================================= */

function updateProfileDisplay(){

  const element =
    document.getElementById("profileName");

  if(!element)return;

  element.textContent =
    currentProfile?.nickname ||
    user?.email ||
    "";

}

/* =========================================================
LOGIN
========================================================= */

document
  .getElementById("loginButton")
  .addEventListener(
    "click",
    async()=>{

      const rememberMe =
        document
          .getElementById("rememberMeCheckbox")
          .checked;

      localStorage.setItem(
        "spaceboards_remember",
        rememberMe ? "true" : "false"
      );

      const email =
        document
          .getElementById("authEmail")
          .value
          .trim()
          .toLowerCase();


      const password =
        document
          .getElementById("authPassword")
          .value;

      const errorBox =
        document.getElementById("authError");

      errorBox.textContent = "";

      if(!email || !password){

        errorBox.textContent =
          "Enter your email and password.";

        return;

      }

      const {
        data,
        error
      } =
        await supabase.auth.signInWithPassword({
          email,
          password

async function loadCurrentProfile(){

  if(!user)return;

  const {
    data,
    error
  } =
    await supabase
      .from("profiles")
      .select("id,email,nickname")
      .eq("id",user.id)
      .maybeSingle();

  if(error){

    console.error(
      "Current profile error:",
      error
    );

    return;

  }

  if(data){

    currentProfile = data;

    profilesCache.set(
      String(data.id),
      data
    );

    updateProfileDisplay();

    return;

  }

  const fallbackNickname =
    user.email?.split("@")[0] ||
    "User";

  const {
    data:newProfile,
    error:newError
  } =
    await supabase
      .from("profiles")
      .upsert(
        {
          id:user.id,
          email:user.email?.toLowerCase() || "",
          nickname:fallbackNickname
        },
        {
          onConflict:"id"
        }
      )
      .select()
      .single();

  if(!newError && newProfile){

    currentProfile = newProfile;

    profilesCache.set(
      String(newProfile.id),
      newProfile
    );

    updateProfileDisplay();

  }

}

LOAD PROFILES

async function loadProfiles(){

  if(!user)return;

  profilesCache.clear();

  if(currentProfile){

    profilesCache.set(
      String(currentProfile.id),
      currentProfile
    );

  }

  const {
    data,
    error
  } =
    await supabase
      .from("profiles")
      .select("id,email,nickname");

  if(error){

    console.error(
      "Could not load profiles:",
      error
    );

    return;

  }

  (data || []).forEach(profile=>{

    profilesCache.set(
      String(profile.id),
      profile
    );

  });

}

/* =========================================================
NICKNAME
========================================================= */

function getNickname(ownerId){

  if(!ownerId)return "";

  const profile =
    profilesCache.get(
      String(ownerId)
    );

  if(profile?.nickname){

    return profile.nickname;

  }

  if(
    currentProfile &&
    String(currentProfile.id) ===
    String(ownerId)
  ){

    return currentProfile.nickname || "";

  }

  return "";

}

async function loadFriends(){

  if(!user)return;

  const {
    data,
    error
  } =
    await supabase
      .from("friend_requests")
      .select("*")
      .or(
        `sender_id.eq.${user.id},receiver_id.eq.${user.id}`
      );

  if(error){

    console.error(error);

    return;

  }

  const accepted =
    (data || []).filter(
      r => r.status === "accepted"
    );

  const ids =
    accepted.map(
      r =>
        r.sender_id === user.id
          ? r.receiver_id
          : r.sender_id
    );

  if(!ids.length){

    friends = [];

    renderFriends();

    return;

  }

  const {
    data:friendProfiles,
    error:profilesError
  } =
    await supabase
      .from("profiles")
      .select("id,email,nickname")
      .in("id",ids);

  if(profilesError){

    console.error(profilesError);

    return;

  }

  friends =
    friendProfiles || [];

  friends.forEach(friend=>{

    profilesCache.set(
      String(friend.id),
      friend
    );

  });

  renderFriends();

}

      if(
        user.email &&

        data:profile,
        error
      } =

          .from("profiles")

      if(error){

        showError(error.message);

        return;

      }

      if(!profile){

        showError(
          "No user with that email was found."
        );

        return;

      }

      const {
        data:existing,
        error:existingError
      } =
        await supabase
          .from("friend_requests")
          .select("id,status")
          .or(
            `and(sender_id.eq.${user.id},receiver_id.eq.${profile.id}),and(sender_id.eq.${profile.id},receiver_id.eq.${user.id})`
          );

      if(existingError){

        showError(existingError.message);

        return;

      }

      if(

          request =>
            request.status === "accepted"
        )

        existing.some(

        error:insertError
      } =
        await supabase
          .from("friend_requests")
          .insert({
            sender_id:user.id,
            receiver_id:profile.id,
            status:"pending"

async function loadFriendRequests(){

  if(!user)return;

  const list =
    document.getElementById("requestsList");

  list.innerHTML =
    "Loading...";

  const {
    data:requests,
    error
  } =
    await supabase
      .from("friend_requests")
      .select("*")
      .eq("receiver_id",user.id)
      .eq("status","pending");

  if(error){

    list.innerHTML =
      `<div style="color:#ff6666">
        ${escapeHTML(error.message)}
      </div>`;

    return;

  }

  if(
    !requests ||
    requests.length === 0
  ){

    list.innerHTML =
      "<p style='font-size:13px;color:#777'>No pending requests.</p>";

    return;

  }

  const ids =
    requests.map(
      request =>
        request.sender_id
    );

  const {
    data:requestProfiles
  } =
    await supabase
      .from("profiles")
      .select("id,email,nickname")
      .in("id",ids);

  (requestProfiles || [])
    .forEach(profile=>{

      profilesCache.set(
        String(profile.id),
        profile
      );

    });

  list.innerHTML = "";

  requests.forEach(request=>{

    const sender =
      (requestProfiles || [])
        .find(
          profile =>
            String(profile.id) ===
            String(request.sender_id)
        );

    const row =
      document.createElement("div");

    row.className = "request";

    row.innerHTML = `

      <div class="request-nickname">
        ${escapeHTML(
          sender?.nickname ||
          sender?.email ||
          "User"
        )}
      </div>

      <div class="request-actions">

        <button
          data-action="accept"
          data-id="${escapeHTML(request.id)}"
          type="button"
        >
          Accept
        </button>

        <button
          data-action="decline"
          data-id="${escapeHTML(request.id)}"
          type="button"
        >
          Decline
        </button>

      </div>
    `;

    list.appendChild(row);

  });

}

async function loadBoards(){

  if(!user)return;

  const {
    data,
    error
  } =
    await supabase
      .from("boxes")
      .select(`
        id,
        owner_id,
        title,
        x,
        y,
        width,
        height,
        created_at,
        visibility,
        box_items(
          id,
          box_id,
          title,
          url,
          image,
          visibility,
          owner_nickname
        )
      `)
      .order(
        "created_at",
        {
          ascending:true
        }
      );

  if(error){

    console.error(
      "Load boards error:",
      error
    );

    showError(
      "Could not load boxes: " +
      error.message
    );

    return;

  }

  await loadProfiles();

  boards =
    (data || []).map(box=>{

      const items =
        Array.isArray(box.box_items)
          ? box.box_items
          : [];

      const ownerNickname =
        getNickname(box.owner_id);

      return {

        ...box,

        w:
          Number(box.width) || 430,

        h:
          Number(box.height) || 270,

        ownerNickname:
          ownerNickname || "",

        items:
          items.filter(
            item =>
              item.visibility === "public" ||
              String(box.owner_id) ===
              String(user.id)
          )

      };

    });

  render();

}

URL PREVIEW
========================================================= */

async function fetchURLPreview(url){

  try{

    const response =
      await fetch(
        `https://api.microlink.io/?url=${encodeURIComponent(url)}`
      );

    const result =
      await response.json();

    if(result.status !== "success")return null;

    return {

      title:
        result.data?.title || "",

      image:
        result.data?.image?.url || ""

    };

}catch(error){

    console.error("Preview fetch failed:", error);

    return null;

  }


}

/* =========================================================
SAVE URL
========================================================= */

async function saveURL(
  board,
  visibility
){

  let url =
    document
      .getElementById("urlAddress")
      .value
      .trim();

  const title =
    document
      .getElementById("urlTitle")
      .value
      .trim();

  const image =
    document
      .getElementById("urlImage")
      .value
      .trim();

  if(!url){

    showError(
      "Enter a URL."
    );

    return;

  }

  if(!/^https?:\/\//i.test(url)){

    url =
      "https://" + url;

  }

  await loadCurrentProfile();

  const ownerNickname =
    currentProfile?.nickname ||
    getNickname(board.owner_id) ||
    "";

  const insertData = {

    box_id:board.id,

    title:
      title || url,

    url:url,

    image:
      image || null,

    visibility:visibility,

    owner_nickname:
      ownerNickname

  };

  let {
    data,
    error
  } =
    await supabase
      .from("box_items")
      .insert(insertData)
      .select()
      .single();

  if(
    error &&
    (
      error.code === "42703" ||
      String(error.message)
        .toLowerCase()
        .includes("owner_nickname")
    )
  ){

    const fallback =
      await supabase
        .from("box_items")
        .insert({
          box_id:board.id,
          title:title || url,
          url:url,
          image:image || null,
          visibility:visibility
        })
        .select()
        .single();

    data =
      fallback.data;

    error =
      fallback.error;

  }

  if(error){

    showError(
      "Could not save URL: " +
      error.message
    );

    return;

  }

  data.owner_nickname =
    ownerNickname;

  board.items.push(data);

  closeModal();

  render();

}

  const {

  } =

  board.items =
    board.items.filter(
      item =>
        String(item.id) !==
        String(itemId)
    );

  render();

}

    } = await supabase
        .from("boxes")
        .delete()
        .eq("id", board.id)
        .eq("owner_id", user.id);

    if(boxError){
        console.error("Delete box error:", boxError);
        showError("Could not delete box: " + boxError.message);
        return;
    }

    // Remove it locally
    boards = boards.filter(
        b => String(b.id) !== String(board.id)
    );

    if(String(selectedBoardId) === String(board.id)){
        selectedBoardId = null;
    }

    contextBoardId = null;

    render();
}

/* =========================================================
RENAME BOARD
========================================================= */

function openRenameModal(board){

  if(!user)return;

  if(
    String(board.owner_id) !==
    String(user.id)
  ){

    showError(
      "You can only rename your own boxes."
    );

    return;

  }

  contextBoardId =
    board.id;

  openModal(`

    <h2>Rename box</h2>

    <input
      id="renameInput"
      type="text"
      value="${escapeHTML(board.title || "")}"
      maxlength="100"
      autocomplete="off"
    >

    <div class="modal-actions">

      <button
        id="renameCancel"
        type="button"
      >
        Cancel
      </button>

      <button
        id="renameSave"
        type="button"
      >
        Save
      </button>

    </div>

  `);

  const input =
    document.getElementById("renameInput");

  const cancel =
    document.getElementById("renameCancel");

  const save =
    document.getElementById("renameSave");

  cancel.onclick =
    closeModal;

  save.onclick =
    ()=>saveBoardName(board);

  input.addEventListener(
    "keydown",
    event=>{

      if(event.key === "Enter"){

        event.preventDefault();

        saveBoardName(board);

      }

      if(event.key === "Escape"){

        event.preventDefault();

        closeModal();

      }

    }
  );

  setTimeout(
    ()=>{

      input.focus();
      input.select();

    },
    50
  );

}

async function saveBoardName(board){

  const input =
    document.getElementById("renameInput");

  if(!input)return;

  const title =
    input.value.trim();

  if(!title){

    showError(
      "Enter a name for the box."
    );

    input.focus();

    return;

  }

  if(!user){

    showError(
      "You must be logged in."
    );

    return;

  }

  if(
    String(board.owner_id) !==
    String(user.id)
  ){

    showError(
      "You can only rename your own boxes."
    );

    return;

  }

  const {
    data,
    error
  } =
    await supabase
      .from("boxes")
      .update({
        title:title
      })
      .eq("id",board.id)
      .eq("owner_id",user.id)
      .select()
      .single();

  if(error){

    showError(
      "Could not rename box: " +
      error.message
    );

    return;

  }

  if(!data){

    showError(
      "The box was not renamed. " +
      "Check the UPDATE policy on the boxes table."
    );

    return;

  }

  board.title =
    data.title;

  closeModal();

  render();

}

if(deleteBoardButton){

          /*
            Do not move when clicking controls.
          */

          if(
            event.target.closest(".item") ||
            event.target.closest("button")
          ){

            return;

          }

          /*
            RESIZE
          */

          if(
            event.target.closest(".resize")
          ){

            resizing = {

              id:board.id,

              startX:
                event.clientX,

              startY:
                event.clientY,

              width:
                board.w,

              height:
                board.h

            };

            element.setPointerCapture(
              event.pointerId
            );

            event.preventDefault();

            return;

          }

          /*
            MOVE
          */

          moving = {

            id:board.id,

            startX:
              event.clientX,

            startY:
              event.clientY,

            x:board.x,

            y:board.y

          };

          selectedBoardId =

          element.setPointerCapture(
            event.pointerId
          );

          event.preventDefault();

      );

        "pointermove",

          if(
            resizing &&
            resizing.id === board.id
          ){

            board.w =
              Math.max(
                180,
                resizing.width +
                (
                  event.clientX -
                  resizing.startX
                ) / zoom
              );

            board.h =
              Math.max(
                120,
                resizing.height +
                (
                  event.clientY -
                  resizing.startY
                ) / zoom
              );

            element.style.width =
              board.w + "px";

            element.style.height =
              board.h + "px";

            return;

          }

          if(
            moving &&
            moving.id === board.id
          ){

            board.x =
              moving.x +
              (
                event.clientX -
                moving.startX
              ) / zoom;

            board.y =
              moving.y +
              (
                event.clientY -
                moving.startY
              ) / zoom;

            element.style.left =
              board.x + "px";

            element.style.top =
              board.y + "px";

          }

        }
      );

      element.addEventListener(
        "pointerup",
        async event=>{

          if(
            moving &&
            moving.id === board.id
          ){

            const finalX =
              board.x;

            const finalY =
              board.y;

            moving = null;

            const {
              error
            } =
              await supabase
                .from("boxes")
                .update({
                  x:finalX,
                  y:finalY
                })
                .eq("id",board.id)
                .eq("owner_id",user.id);

            if(error){

          }

          if(

            resizing.id === board.id

              board.w;

            const finalHeight =
              board.h;

            resizing = null;

            const {

                .from("boxes")

                  width:finalWidth,
                  height:finalHeight
                })
                .eq("id",board.id)
                .eq("owner_id",user.id);

            if(error){

              console.error(
                "Resize save error:",
                error
              );

            }

          }

        }
      );

      element.addEventListener(
        "pointercancel",
        ()=>{

          moving = null;
          resizing = null;

        }
      );

);

/* =========================================================
TOUCH PAN + PINCH
========================================================= */

function distance(a,b){

  return Math.hypot(
    a.clientX - b.clientX,
    a.clientY - b.clientY
  );

}

function midpoint(a,b){

  return {

    x:
      (a.clientX + b.clientX) / 2,

    y:
      (a.clientY + b.clientY) / 2

  };

}

workspace.addEventListener(
  "pointerdown",
  event=>{

    if(mobileListMode)return;

    if(
      event.pointerType !== "touch"
    ){
      
      return;

    }

    pointers.set(
      event.pointerId,
      {
        clientX:event.clientX,
        clientY:event.clientY
      }
    );

    if(pointers.size === 1){

      if(
        !event.target.closest(".board")
      ){

        panning = {

          x:event.clientX,
          y:event.clientY,

          panX:panX,
          panY:panY

        };

      }

    }

    if(pointers.size === 2){

      panning = null;

      const points =
        [...pointers.values()];

      pinchStartDistance =
        distance(
          points[0],
          points[1]
        );

      pinchStartZoom =
        zoom;

      pinchStartCenter =
        midpoint(
          points[0],
          points[1]
        );

      pinchStartPanX =
        panX;

      pinchStartPanY =
        panY;

    }

  }
);

workspace.addEventListener(
  "pointermove",
  event=>{

    if(mobileListMode)return;

    if(
      event.pointerType !== "touch"
    ){

      return;

    }

    if(
      !pointers.has(event.pointerId)
    ){

      return;

    }


    pointers.set(
      event.pointerId,
      {
        clientX:event.clientX,
        clientY:event.clientY
      }
    );

    if(
      pointers.size === 1 &&
      panning
    ){

      panX =
        panning.panX +
        event.clientX -
        panning.x;

      panY =
        panning.panY +
        event.clientY -
        panning.y;

      document
        .getElementById("world")
        .style.transform =
          `translate(${panX}px,${panY}px) scale(${zoom})`;

      return;

    }

    if(pointers.size === 2){

      const points =
        [...pointers.values()];

      const currentDistance =
        distance(
          points[0],
          points[1]
        );

      if(!pinchStartDistance){

        return;

      }

      let newZoom =
        pinchStartZoom *
        (
          currentDistance /
          pinchStartDistance
        );

      newZoom =
        Math.max(
          0.25,
          Math.min(
            3,
            newZoom
          )
        );

      const center =
        midpoint(
          points[0],
          points[1]
        );

      const rect =
        workspace.getBoundingClientRect();

      const worldX =
        (
          pinchStartCenter.x -
          rect.left -
          pinchStartPanX
        ) /
        pinchStartZoom;

      const worldY =
        (
          pinchStartCenter.y -
          rect.top -
          pinchStartPanY
        ) /
        pinchStartZoom;

      panX =
        center.x -
        rect.left -
        worldX * newZoom;

      panY =
        center.y -
        rect.top -
        worldY * newZoom;

      zoom =
        newZoom;

      document
        .getElementById("world")
        .style.transform =
          `translate(${panX}px,${panY}px) scale(${zoom})`;

    }

  }
);

function endTouch(event){

  if(
    event.pointerType !== "touch"
  ){

    return;

  }

  pointers.delete(
    event.pointerId
  );

  if(pointers.size < 2){

    pinchStartDistance =
      null;

  }

  if(pointers.size === 0){

    panning = null;

  }

}

workspace.addEventListener(
  "pointerup",
  endTouch
);

workspace.addEventListener(
  "pointercancel",
  endTouch
);

/* =========================================================
MOUSE WHEEL ZOOM
========================================================= */

workspace.addEventListener(
  "wheel",
  event=>{

    event.preventDefault();

    const rect =
      workspace.getBoundingClientRect();

    const mouseX =
      event.clientX -
      rect.left;

    const mouseY =
      event.clientY -
      rect.top;

    const worldX =
      (mouseX - panX) /
      zoom;

    const worldY =
      (mouseY - panY) /
      zoom;

    const factor =
      event.deltaY < 0
        ? 1.1
        : 0.9;

    zoom =
      Math.max(
        0.25,
        Math.min(
          3,
          zoom * factor
        )
      );

    panX =
      mouseX -
      worldX * zoom;

    panY =
      mouseY -
      worldY * zoom;

    document
      .getElementById("world")
      .style.transform =
        `translate(${panX}px,${panY}px) scale(${zoom})`;

  },
  {
    passive:false
  }
);

/* =========================================================
INITIAL UI
========================================================= */

updateAuthUI();

render();

</script>
