<script type="module">

import {
createClient
}
from "https://esm.sh/@supabase/supabase-js@2";

/* =========================================================
SUPABASE
========================================================= */

const SUPABASE_URL =
"https://uqpivlamfwbjoqvordcm.supabase.co";

const SUPABASE_KEY =
"sb_publishable_8CryzR2sR-y5nHprgLWJlA_Wfy_mTrj";

const supabase =
createClient(
SUPABASE_URL,
SUPABASE_KEY,
{
auth:{
persistSession:true,
autoRefreshToken:true,
detectSessionInUrl:true
}
}
);

/* =========================================================
STATE
========================================================= */

let user=null;
let currentProfile=null;

let profilesCache=new Map();

let boards=[];
let friends=[];

let selectedBoardId=null;
let contextBoardId=null;

let moving=null;
let resizing=null;
let panning=null;

let panX=80;
let panY=80;
let zoom=1;

let pointers=new Map();

let pinchStartDistance=null;
let pinchStartZoom=1;
let pinchStartCenter=null;
let pinchStartPanX=0;
let pinchStartPanY=0;

let authLoading=false;

/* Prevent multiple simultaneous login/session loads */
let loginPromise=null;

/* =========================================================
HELPERS
========================================================= */

function escapeHTML(value){

return String(value ?? "")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}

function openModal(html){

document.getElementById("modal").innerHTML=html;

document.getElementById("modalBackground").style.display="flex";

}

function closeModal(){

document.getElementById("modalBackground").style.display="none";

}

window.closeModal=closeModal;

function showError(message){

alert(message);

}

/* =========================================================
AUTH UI
========================================================= */

let signupMode=false;

function updateAuthUI(){

const description=
document.getElementById("authDescription");

const loginButton=
document.getElementById("loginButton");

const signupButton=
document.getElementById("signupButton");

const nickname=
document.getElementById("authNickname");

if(signupMode){

description.textContent=
"Create a new Spaceboards account.";

loginButton.style.display="none";

signupButton.textContent=
"Create account";

nickname.style.display="block";

}else{

description.textContent=
"Log in to Spaceboards.";

loginButton.style.display="inline-block";

signupButton.textContent=
"Create account";

/*
Nickname is not required for login.
Hide it while logging in.
*/
nickname.style.display="none";

}

}

/* =========================================================
SHOW / HIDE AUTH SCREEN
========================================================= */

function showAuthScreen(){

document.getElementById("authScreen")
.style.display="flex";

}

function hideAuthScreen(){

document.getElementById("authScreen")
.style.display="none";

}

/* =========================================================
PROFILE DISPLAY
========================================================= */

function updateProfileDisplay(){

const element=
document.getElementById("profileName");

if(!element)return;

element.textContent=
currentProfile?.nickname||
user?.email||
"";

}

/* =========================================================
LOGIN
========================================================= */

document.getElementById("loginButton")
.addEventListener(
"click",
async()=>{

if(authLoading)return;

authLoading=true;

const email=
document.getElementById("authEmail")
.value
.trim()
.toLowerCase();

const password=
document.getElementById("authPassword")
.value;

const errorBox=
document.getElementById("authError");

errorBox.textContent="";

if(!email||!password){

errorBox.textContent=
"Enter your email and password.";

authLoading=false;

return;

}

try{

const {
data,
error
}=
await supabase.auth.signInWithPassword({

email:email,

password:password

});

if(error){

errorBox.textContent=
error.message;

authLoading=false;

return;

}

if(!data?.user){

errorBox.textContent=
"Login failed. No user was returned.";

authLoading=false;

return;

}

/*
IMPORTANT:
Use the user returned directly by Supabase.
Do not wait for onAuthStateChange.
*/
user=data.user;

/*
Hide the login screen immediately after successful
authentication. Database loading must not prevent login.
*/
hideAuthScreen();

await finishLogin();

authLoading=false;

}catch(error){

console.error(
"Login error:",
error
);

errorBox.textContent=
error?.message||
"An unexpected error occurred while logging in.";

showAuthScreen();

authLoading=false;

}

});

/* =========================================================
FINISH LOGIN
========================================================= */

async function finishLogin(){

if(!user)return;

/*
If another finishLogin() is already running,
wait for that one instead of running everything twice.
*/
if(loginPromise){

return loginPromise;

}

loginPromise=(async()=>{

try{

/*
Do not let a database/RLS problem make authentication
look like it failed.
*/

try{

await loadCurrentProfile();

}catch(error){

console.error(
"Profile loading error:",
error
);

}

try{

await loadProfiles();

}catch(error){

console.error(
"Profiles loading error:",
error
);

}

try{

await loadFriends();

}catch(error){

console.error(
"Friends loading error:",
error
);

}

try{

await loadBoards();

}catch(error){

console.error(
"Boards loading error:",
error
);

}

try{

await loadFriendRequests();

}catch(error){

console.error(
"Friend requests loading error:",
error
);

}

updateProfileDisplay();

hideAuthScreen();

render();

renderFriends();

}catch(error){

console.error(
"Finish login error:",
error
);

/*
The user is still authenticated even if some
database operation failed.
*/
hideAuthScreen();

render();

renderFriends();

}finally{

loginPromise=null;

}

})();

return loginPromise;

}

/* =========================================================
CREATE ACCOUNT
========================================================= */

document.getElementById("signupButton")
.addEventListener(
"click",
async()=>{

if(!signupMode){

signupMode=true;

updateAuthUI();

document
.getElementById("authNickname")
.focus();

return;

}

if(authLoading)return;

authLoading=true;

const email=
document.getElementById("authEmail")
.value
.trim()
.toLowerCase();

const nickname=
document.getElementById("authNickname")
.value
.trim();

const password=
document.getElementById("authPassword")
.value;

const errorBox=
document.getElementById("authError");

errorBox.textContent="";

try{

if(!email||!nickname||!password){

errorBox.textContent=
"Enter your email, nickname and password.";

authLoading=false;

return;

}

if(nickname.length<2){

errorBox.textContent=
"Nickname must be at least 2 characters.";

authLoading=false;

return;

}

if(nickname.length>30){

errorBox.textContent=
"Nickname must be 30 characters or less.";

authLoading=false;

return;

}

if(password.length<6){

errorBox.textContent=
"Password must be at least 6 characters.";

authLoading=false;

return;

}

/*
Check nickname.
*/
const {
data:existingNickname,
error:nicknameError
}=
await supabase
.from("profiles")
.select("id")
.ilike("nickname",nickname)
.limit(1)
.maybeSingle();

if(nicknameError){

console.error(
"Nickname check error:",
nicknameError
);

}

if(existingNickname){

errorBox.textContent=
"That nickname is already taken.";

authLoading=false;

return;

}

/*
Create Supabase Auth account.
*/
const {
data,
error
}=
await supabase.auth.signUp({

email:email,

password:password

});

if(error){

errorBox.textContent=
error.message;

authLoading=false;

return;

}

if(!data?.user){

errorBox.textContent=
"Account could not be created.";

authLoading=false;

return;

}

/*
Create profile.
*/
const {
data:profile,
error:profileError
}=
await supabase
.from("profiles")
.upsert({
id:data.user.id,
email:email,
nickname:nickname
},{
onConflict:"id"
})
.select()
.single();

if(profileError){

console.error(
"Profile creation error:",
profileError
);

errorBox.textContent=
"Account was created, but the profile could not be saved: "+
profileError.message;

authLoading=false;

return;

}

currentProfile=profile;

profilesCache.set(
String(data.user.id),
profile
);

updateProfileDisplay();

/*
If email confirmation is disabled, Supabase gives us
a session immediately.
*/
if(data.session){

user=data.user;

hideAuthScreen();

await finishLogin();

authLoading=false;

return;

}

/*
If email confirmation is enabled, there is no session yet.
*/
errorBox.textContent=
"Account created. Check your email to confirm your account, then log in.";

signupMode=false;

document.getElementById("authPassword")
.value="";

updateAuthUI();

}catch(error){

console.error(
"Signup error:",
error
);

errorBox.textContent=
error?.message||
"An unexpected error occurred while creating the account.";

}finally{

authLoading=false;

}

});

/* =========================================================
AUTH KEYBOARD
========================================================= */

document.getElementById("authEmail")
.addEventListener(
"keydown",
event=>{

if(event.key==="Enter"){

if(signupMode){

document
.getElementById("authNickname")
.focus();

}else{

document
.getElementById("authPassword")
.focus();

}

}

});

document.getElementById("authNickname")
.addEventListener(
"keydown",
event=>{

if(event.key==="Enter"){

document
.getElementById("authPassword")
.focus();

}

});

document.getElementById("authPassword")
.addEventListener(
"keydown",
event=>{

if(event.key==="Enter"){

if(signupMode){

document
.getElementById("signupButton")
.click();

}else{

document
.getElementById("loginButton")
.click();

}

}

});

/* =========================================================
AUTH STATE CHANGE
========================================================= */

/*
IMPORTANT:
Do not make the callback itself async.
Do not await Supabase database queries directly inside it.
*/

supabase.auth.onAuthStateChange(
(event,session)=>{

console.log(
"Auth state:",
event,
session?.user?.email || "no user"
);

user=
session?.user||
null;

if(user){

/*
Run after the callback has returned.
*/
setTimeout(
()=>{

finishLogin()
.catch(error=>{

console.error(
"Session loading error:",
error
);

hideAuthScreen();

});

},
0
);

}else{

loginPromise=null;

document.getElementById("authError")
.textContent="";

showAuthScreen();

boards=[];
friends=[];

selectedBoardId=null;

currentProfile=null;

profilesCache.clear();

updateProfileDisplay();

render();

renderFriends();

}

});

/* =========================================================
INITIAL SESSION
========================================================= */

async function initializeApp(){

try{

/*
Always start by showing the authentication screen.
*/
showAuthScreen();

const {
data,
error
}=
await supabase.auth.getSession();

if(error){

console.error(
"Session error:",
error
);

showAuthScreen();

return;

}

if(data?.session?.user){

user=data.session.user;

/*
A valid existing session means the user is already
logged in. Hide auth immediately.
*/
hideAuthScreen();

await finishLogin();

}else{

user=null;

showAuthScreen();

render();

}

}catch(error){

console.error(
"Initialization error:",
error
);

showAuthScreen();

}

}

/* =========================================================
LOAD CURRENT PROFILE
========================================================= */

async function loadCurrentProfile(){

if(!user)return;

const {
data,
error
}=
await supabase
.from("profiles")
.select("id,email,nickname")
.eq("id",user.id)
.maybeSingle();

if(error){

console.error(
"Current profile error:",
error
);

return;

}

if(data){

currentProfile=data;

profilesCache.set(
String(data.id),
data
);

updateProfileDisplay();

return;

}

/*
If the user exists in Auth but has no profile,
create a fallback profile.
*/
const fallbackNickname=
user.email?.split("@")[0]||
"User";

const {
data:newProfile,
error:newError
}=
await supabase
.from("profiles")
.upsert({
id:user.id,
email:user.email?.toLowerCase()||"",
nickname:fallbackNickname
},{
onConflict:"id"
})
.select()
.single();

if(!newError&&newProfile){

currentProfile=newProfile;

profilesCache.set(
String(newProfile.id),
newProfile
);

updateProfileDisplay();

}else if(newError){

console.error(
"Could not create fallback profile:",
newError
);

}

}

/* =========================================================
LOAD PROFILES
========================================================= */

async function loadProfiles(){

if(!user)return;

const ownProfile=currentProfile;

profilesCache.clear();

if(ownProfile){

profilesCache.set(
String(ownProfile.id),
ownProfile
);

}

const {
data,
error
}=
await supabase
.from("profiles")
.select("id,email,nickname");

if(error){

console.error(
"Could not load profiles:",
error
);

return;

}

(data||[]).forEach(profile=>{

profilesCache.set(
String(profile.id),
profile
);

});

}

/* =========================================================
GET NICKNAME
========================================================= */

function getNickname(ownerId){

if(!ownerId)return "";

const profile=
profilesCache.get(
String(ownerId)
);

if(profile?.nickname){

return profile.nickname;

}

if(
currentProfile &&
String(currentProfile.id)===
String(ownerId)
){

return currentProfile.nickname||"";

}

return "";

}

/* =========================================================
LOGOUT
========================================================= */

document.getElementById("logoutButton")
.addEventListener(
"click",
async()=>{

try{

await supabase.auth.signOut();

}catch(error){

console.error(

);

/* =========================================================
FRIENDS
========================================================= */

async function loadFriends(){

if(!user)return;

const {
data,
error
}=
await supabase
.from("friend_requests")
.select("*")
.or(
`sender_id.eq.${user.id},receiver_id.eq.${user.id}`
);

if(error){

console.error(error);

return;

}

const accepted=
(data||[])
.filter(
r=>
r.status==="accepted"
);

const ids=
accepted.map(
r=>
r.sender_id===user.id
?r.receiver_id
:r.sender_id
);

if(!ids.length){

friends=[];

renderFriends();

return;

}

const {
data:friendProfiles,
error:profilesError
}=
await supabase
.from("profiles")
.select("id,email,nickname")
.in("id",ids);

if(profilesError){

console.error(profilesError);

return;

}

friends=
friendProfiles||[];

friends.forEach(friend=>{

profilesCache.set(
String(friend.id),
friend
);

});

renderFriends();

}

/* =========================================================
RENDER FRIENDS
========================================================= */

function renderFriends(){

const list=
document.getElementById("friendsList");

if(!list)return;

list.innerHTML="";

friends.forEach(friend=>{

const element=
document.createElement("div");

element.className="friend";

element.textContent=
friend.nickname||
friend.email||
"User";

list.appendChild(element);

});

}

/* =========================================================
ADD FRIEND
========================================================= */

document.getElementById("addFriendButton")
.addEventListener(
"click",
async()=>{

const input=
document.getElementById("addFriendInput");

const email=
input.value
.trim()
.toLowerCase();

if(!email){

showError(
"Enter your friend's email."
);

return;

}

if(
user.email &&
email===user.email.toLowerCase()
){

showError(
"You cannot add yourself."
);

return;

}

const {
data:profile,
error
}=
await supabase
.from("profiles")
.select("id,email,nickname")
.eq("email",email)
.maybeSingle();

if(error){

showError(error.message);

return;

}

if(!profile){

showError(
"No user with that email was found."
);

return;

}

if(profile.id===user.id){

showError(
"You cannot add yourself."
);

return;

}

profilesCache.set(
String(profile.id),
profile
);

const {
data:existing,
error:existingError
}=
await supabase
.from("friend_requests")
.select("id,status")
.or(
`and(sender_id.eq.${user.id},receiver_id.eq.${profile.id}),and(sender_id.eq.${profile.id},receiver_id.eq.${user.id})`
);

if(existingError){

showError(existingError.message);

return;

}

if(existing&&existing.length){

if(
existing.some(
request=>
request.status==="accepted"
)
){

showError(
"You are already friends with this user."
);

return;

}

if(
existing.some(
request=>
request.status==="pending"
)
){

showError(
"A friend request already exists."
);

return;

}

}

const {
error:insertError
}=
await supabase
.from("friend_requests")
.insert({
sender_id:user.id,
receiver_id:profile.id,
status:"pending"
});

if(insertError){

showError(insertError.message);

return;

}

input.value="";

showError(
"Friend request sent."
);

});

/* =========================================================
FRIEND REQUESTS
========================================================= */

document.getElementById("friendRequestsButton")
.addEventListener(
"click",
async()=>{

const panel=
document.getElementById("requestsPanel");

if(panel.style.display==="block"){

panel.style.display="none";

return;

}

panel.style.display="block";

await loadFriendRequests();

});

async function loadFriendRequests(){

if(!user)return;

const list=
document.getElementById("requestsList");

list.innerHTML="Loading...";

const {
data:requests,
error
}=
await supabase
.from("friend_requests")
.select("*")
.eq("receiver_id",user.id)
.eq("status","pending");

if(error){

list.innerHTML=
`<div style="color:#ff6666">
${escapeHTML(error.message)}
</div>`;

return;

}

if(
!requests ||
requests.length===0
){

list.innerHTML=
"<p style='font-size:13px;color:#777'>No pending requests.</p>";

return;

}

const ids=
requests.map(
request=>
request.sender_id
);

const {
data:requestProfiles
}=
await supabase
.from("profiles")
.select("id,email,nickname")
.in("id",ids);

(requestProfiles||[]).forEach(profile=>{

profilesCache.set(
String(profile.id),
profile
);

});

list.innerHTML="";

requests.forEach(request=>{

const sender=
(requestProfiles||[])
.find(
profile=>
String(profile.id) ===
String(request.sender_id)
);

const row=
document.createElement("div");

row.className="request";

row.innerHTML=`

<div class="request-nickname">

${escapeHTML(
sender?.nickname||
sender?.email||
"User"
)}

</div>

<div class="request-actions">

<button
data-action="accept"
data-id="${escapeHTML(request.id)}"
>
Accept
</button>

<button
data-action="decline"
data-id="${escapeHTML(request.id)}"
>
Decline
</button>

</div>

`;

list.appendChild(row);

});

}

/* =========================================================
REQUEST ACTIONS
========================================================= */

document.getElementById("requestsList")
.addEventListener(
"click",
async event=>{

const button=
event.target.closest("button");

if(!button)return;

const id=button.dataset.id;
const action=button.dataset.action;

if(action==="accept"){

const {
error
}=
await supabase
.from("friend_requests")
.update({
status:"accepted"
})
.eq("id",id)
.eq("receiver_id",user.id);

if(error){

showError(error.message);

return;

}

await loadProfiles();
await loadFriends();
await loadFriendRequests();

}

if(action==="decline"){

const {
error
}=
await supabase
.from("friend_requests")
.delete()
.eq("id",id)
.eq("receiver_id",user.id);

if(error){

showError(error.message);

return;

}

await loadFriendRequests();

}

});

/* =========================================================
LOAD BOARDS
========================================================= */

async function loadBoards(){

if(!user)return;

const {
data,
error
}=
await supabase
.from("boxes")
.select(`
id,
owner_id,
title,
x,
y,
width,
height,
created_at,
visibility,
box_items(
id,
box_id,
title,
url,
image,
visibility,
owner_nickname
)
`)
.order("created_at");

if(error){

console.error(
"Load boards error:",
error
);

return;

}

await loadProfiles();

boards=
(data||[])
.map(box=>{

const items=
Array.isArray(box.box_items)
?box.box_items
:[];

const ownerNickname=
getNickname(box.owner_id);

return{

...box,

w:Number(box.width)||430,

h:Number(box.height)||270,

ownerNickname:
ownerNickname||"",

items:
items.filter(
item=>
item.visibility==="public"||
String(box.owner_id)===
String(user.id)
)

};

});

render();

}

/* =========================================================
NEW BOX
========================================================= */

document.getElementById("newBoxButton")
.addEventListener(
"click",
async()=>{

if(!user)return;

const ownBoards=
boards
.filter(
b=>
String(b.owner_id)===
String(user.id)
)
.sort(
(a,b)=>
new Date(a.created_at||0)-
new Date(b.created_at||0)
);

const boxWidth=430;
const boxHeight=270;
const gap=40;

const index=ownBoards.length;

const column=index%3;
const row=Math.floor(index/3);

const x=
120+
column*(boxWidth+gap);

const y=
120+
row*(boxHeight+gap);

const {
data,
error
}=
await supabase
.from("boxes")
.insert({
owner_id:user.id,
title:"New box",
x,
y,
width:boxWidth,
height:boxHeight,
visibility:"public"
})
.select()
.single();

if(error){

showError(error.message);

return;

}

boards.push({

...data,

w:boxWidth,

h:boxHeight,

ownerNickname:
currentProfile?.nickname||"",

items:[]

});

selectedBoardId=data.id;

render();

});

/* =========================================================
NEW URL

document.getElementById("newUrlButton")

/* =========================================================
SAVE URL
========================================================= */

async function saveURL(
board,
visibility
){

let url=
document.getElementById("urlAddress")
.value
.trim();

const title=
document.getElementById("urlTitle")
.value
.trim();

const image=
document.getElementById("urlImage")
.value
.trim();

if(!url){

showError("Enter a URL.");

return;

}

if(!/^https?:\/\//i.test(url)){

url="https://"+url;

}

await loadCurrentProfile();

const ownerNickname=
currentProfile?.nickname||
getNickname(board.owner_id)||
"";

const insertData={

box_id:board.id,

title:title||url,

url,

image:image||null,

visibility,

owner_nickname:ownerNickname

};

let {
data,
error
}=
await supabase
.from("box_items")
.insert(insertData)
.select()
.single();

if(
error &&
(
error.code==="42703" ||
String(error.message)
.toLowerCase()
.includes("owner_nickname")
)
){

const fallback=
await supabase
.from("box_items")
.insert({
box_id:board.id,
title:title||url,
url,
image:image||null,
visibility
})
.select()
.single();

data=fallback.data;
error=fallback.error;

}

if(error){

showError(
"Could not save URL: "+
error.message
);

return;

}

if(!data){

showError(
"Could not save URL."
);

return;

}

data.owner_nickname=
ownerNickname;

board.ownerNickname=
ownerNickname||
board.ownerNickname||
"";

board.items.push(data);

closeModal();

render();

}

/* =========================================================
DELETE URL
========================================================= */

async function deleteURL(
board,
itemId
){

if(!confirm("Delete this URL?"))return;

const {
error
}=
await supabase
.from("box_items")
.delete()
.eq("id",itemId)
.eq("box_id",board.id);

if(error){

showError(
"Could not delete URL: "+
error.message
);

return;

}

board.items=
board.items.filter(
item=>
String(item.id)!==
String(itemId)
);

render();

}

/* =========================================================
DELETE BOX
========================================================= */

async function deleteBoard(board){

if(!user){

showError(
"You must be logged in."
);

return;

}

if(
String(board.owner_id)!==
String(user.id)
){

showError(
"You can only delete your own boxes."
);

return;

}

if(!confirm(
"Delete this box and all of its URLs?"
))return;

const {
error:itemError
}=
await supabase
.from("box_items")
.delete()
.eq("box_id",board.id);

if(itemError){

showError(
"Could not delete the URLs in this box: "+
itemError.message
);

return;

}

const {
data:deleted,
error:boxError
}=
await supabase
.from("boxes")
.delete()
.eq("id",board.id)
.eq("owner_id",user.id)
.select();

if(boxError){

showError(
"Could not delete box: "+
boxError.message
);

return;

}

if(
!deleted ||
deleted.length===0
){

showError(
"Supabase did not allow this box to be deleted. Check the DELETE policy for the boxes table."
);

return;

}

boards=
boards.filter(
b=>
String(b.id)!==
String(board.id)
);

if(
String(selectedBoardId)===
String(board.id)
){

selectedBoardId=null;

}

render();

}

element.style.height=
Number(board.h)+"px";

RENDER
========================================================= */

const world=
document.getElementById("world");

world.style.transform=
`translate(${panX}px,${panY}px) scale(${zoom})`;

world.innerHTML="";

boards.forEach(board=>{

const element=
document.createElement("section");

element.className=
"board"+
(
String(selectedBoardId)===
String(board.id)

:""
);

element.dataset.id=
board.id;

element.style.left=
Number(board.x)+"px";

element.style.top=
Number(board.y)+"px";

element.style.width=
Number(board.w)+"px";

element.style.height=
Number(board.h)+"px";

const owner=
String(board.owner_id)===
String(user.id);

let boardNickname=
board.ownerNickname||
"";

if(
owner &&
currentProfile?.nickname
){

boardNickname=
currentProfile.nickname;

}

boardNickname=
getNickname(board.owner_id)||
"";

}

element.innerHTML=`

<div class="board-title">
${escapeHTML(board.title)}
</div>

${
owner
?
`
<div class="board-actions">

<button
class="trash-button"
title="Delete box"
data-delete-board="${escapeHTML(board.id)}"
>
×
</button>

</div>
`
:""
}

<div class="board-inner">

${
owner
?
`
<button
class="add-url"
data-add-url="${escapeHTML(board.id)}"
>
+ Add URL
</button>
`
:""
}

${
board.items.map(item=>{

boardNickname||
"";

class="item"
data-item-id="${escapeHTML(item.id)}"

>

${
item.image
?
`

}

<div class="item-content">

${escapeHTML(itemNickname)}

<span class="item-visibility">
${item.visibility==="public"?"Public":"Private"}
</span>

${
owner
?
`
<button
class="item-trash"

data-delete-item="${escapeHTML(item.id)}"
>
×
</button>
`
:""
}

</div>

}

</div>

${
owner
?
`

"click",
event=>{

element

element

"click",

element.addEventListener(
"contextmenu",
event=>{

if(!owner)return;

board.id;

document.getElementById("contextMenu");

menu.style.display="block";

menu.style.left=
event.clientX+"px";

menu.style.top=
event.clientY+"px";

if(owner){

element.addEventListener(
"pointerdown",
event=>{

if(event.pointerType==="touch")return;

if(event.target.closest(".item"))return;
if(event.target.closest(".add-url"))return;
if(event.target.closest(".trash-button"))return;

event.stopPropagation();

if(event.target.closest(".resize")){

resizing={

id:String(board.id),

pointerId:event.pointerId,

startX:event.clientX,

startY:event.clientY,

width:Number(board.w)||430,

height:Number(board.h)||270

};

element.setPointerCapture(
event.pointerId
);

event.preventDefault();

return;

}

moving={

id:String(board.id),

pointerId:event.pointerId,

startX:event.clientX,

startY:event.clientY,

x:Number(board.x)||0,

y:Number(board.y)||0

};

element.setPointerCapture(
event.pointerId
);

selectedBoardId=board.id;

element.classList.add("selected");

event.preventDefault();

});

element.addEventListener(
"pointermove",
event=>{

if(
resizing &&
resizing.id===String(board.id) &&
resizing.pointerId===event.pointerId
){

board.w=
Math.max(
180,
resizing.width+
(event.clientX-resizing.startX)/zoom
);

board.h=
Math.max(
120,
resizing.height+
(event.clientY-resizing.startY)/zoom
);

element.style.width=
board.w+"px";

element.style.height=
board.h+"px";

event.preventDefault();

return;

}

if(
moving &&
moving.id===String(board.id) &&
moving.pointerId===event.pointerId
){

board.x=
moving.x+
(event.clientX-moving.startX)/zoom;

board.y=
moving.y+
(event.clientY-moving.startY)/zoom;

element.style.left=
board.x+"px";

element.style.top=
board.y+"px";

event.preventDefault();

}

});

element.addEventListener(
"pointerup",
async event=>{

if(
moving &&
moving.id===String(board.id) &&
moving.pointerId===event.pointerId
){

const finalX=
Number(board.x);

const finalY=
Number(board.y);

moving=null;

try{

await supabase
.from("boxes")
.update({
x:finalX,
y:finalY
})
.eq("id",board.id)
.eq("owner_id",user.id);

}catch(error){

console.error(
"Could not save board position:",
error
);

}

}

if(
resizing &&
resizing.id===String(board.id) &&
resizing.pointerId===event.pointerId
){

const finalWidth=
Number(board.w);

const finalHeight=
Number(board.h);

resizing=null;

try{

await supabase
.from("boxes")
.update({
width:finalWidth,
height:finalHeight
})
.eq("id",board.id)
.eq("owner_id",user.id);

}catch(error){

console.error(
"Could not save board size:",

);

}

}

});

element.addEventListener(
"pointercancel",
event=>{

moving &&
moving.id===String(board.id) &&
moving.pointerId===event.pointerId
){

moving=null;

}

if(
resizing &&
resizing.id===String(board.id) &&
resizing.pointerId===event.pointerId
){

resizing=null;

}

});

}

});

/* =========================================================
DESKTOP PAN
========================================================= */

const workspace=
document.getElementById("workspace");

workspace.addEventListener(
"pointerdown",
event=>{

if(event.pointerType==="touch")return;

if(event.target.closest(".board"))return;

if(event.target.closest("button"))return;

panning={

x:event.clientX,

y:event.clientY,

panX:panX,

panY:panY

};

workspace.setPointerCapture?.(
event.pointerId
);

});

workspace.addEventListener(
"pointermove",
event=>{

if(!panning)return;

panX=
panning.panX+
event.clientX-
panning.x;

panY=
panning.panY+
event.clientY-
panning.y;

document.getElementById("world")
.style.transform=
`translate(${panX}px,${panY}px) scale(${zoom})`;

});

workspace.addEventListener(
"pointerup",
()=>{
panning=null;
});

workspace.addEventListener(
"pointercancel",
()=>{
panning=null;
});

/* =========================================================
TOUCH PAN + PINCH
========================================================= */

function distance(a,b){

return Math.hypot(
a.clientX-b.clientX,
a.clientY-b.clientY
);

}

function midpoint(a,b){

return{

x:(a.clientX+b.clientX)/2,

y:(a.clientY+b.clientY)/2

};

}

workspace.addEventListener(
"pointerdown",
event=>{

if(event.pointerType!=="touch")return;

pointers.set(
event.pointerId,
{
clientX:event.clientX,
clientY:event.clientY
}
);

if(pointers.size===1){

if(!event.target.closest(".board")){

panning={

x:event.clientX,

y:event.clientY,

panX:panX,

panY:panY

};

}

}

if(pointers.size===2){

panning=null;

const points=
[...pointers.values()];

pinchStartDistance=
distance(
points[0],
points[1]
);

pinchStartZoom=zoom;

pinchStartCenter=
midpoint(
points[0],
points[1]
);

pinchStartPanX=panX;
pinchStartPanY=panY;

}

});

workspace.addEventListener(
"pointermove",
event=>{

if(event.pointerType!=="touch")return;

if(!pointers.has(event.pointerId))return;

pointers.set(
event.pointerId,
{
clientX:event.clientX,
clientY:event.clientY
}
);

if(
pointers.size===1 &&
panning
){

panX=
panning.panX+
event.clientX-
panning.x;

panY=
panning.panY+
event.clientY-
panning.y;

document.getElementById("world")
.style.transform=
`translate(${panX}px,${panY}px) scale(${zoom})`;

return;

}

if(pointers.size===2){

const points=
[...pointers.values()];

const currentDistance=
distance(
points[0],
points[1]
);

if(!pinchStartDistance)return;

let newZoom=
pinchStartZoom*
(
currentDistance/
pinchStartDistance
);

newZoom=
Math.max(
0.25,
Math.min(
3,
newZoom
)
);

const center=
midpoint(
points[0],
points[1]
);

const rect=
workspace.getBoundingClientRect();

const worldX=
(
pinchStartCenter.x-
rect.left-
pinchStartPanX
)/
pinchStartZoom;

const worldY=
(
pinchStartCenter.y-
rect.top-
pinchStartPanY
)/
pinchStartZoom;

panX=
center.x-
rect.left-
worldX*newZoom;

panY=
center.y-
rect.top-
worldY*newZoom;

zoom=newZoom;

document.getElementById("world")
.style.transform=
`translate(${panX}px,${panY}px) scale(${zoom})`;

}

});

function endTouch(event){

if(event.pointerType!=="touch")return;

pointers.delete(
event.pointerId
);

if(pointers.size<2){

pinchStartDistance=null;

}

if(pointers.size===0){

panning=null;

}

}

workspace.addEventListener(
"pointerup",
endTouch
);

workspace.addEventListener(
"pointercancel",
endTouch
);

/* =========================================================
MOUSE WHEEL ZOOM
========================================================= */

workspace.addEventListener(
"wheel",
event=>{

event.preventDefault();

const rect=
workspace.getBoundingClientRect();

const mouseX=
event.clientX-
rect.left;

const mouseY=
event.clientY-
rect.top;

const worldX=
(mouseX-panX)/
zoom;

const worldY=
(mouseY-panY)/
zoom;

const factor=
event.deltaY<0
?1.1
:0.9;

zoom=
Math.max(
0.25,
Math.min(
3,
zoom*factor
)
);

panX=
mouseX-
worldX*zoom;

panY=
mouseY-
worldY*zoom;

document.getElementById("world")
.style.transform=
`translate(${panX}px,${panY}px) scale(${zoom})`;

},
{
passive:false
}
);
