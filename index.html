<script type="module">

import {
createClient
}
from
"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";


/* =========================================================
SUPABASE
========================================================= */

const SUPABASE_URL =
"https://uqpivlamfwbjoqvordcm.supabase.co";

const SUPABASE_KEY =
"sb_publishable_8CryzR2sR-y5nHprgLWJlA_Wfy_mTrj";


/*
IMPORTANT:

persistSession:false means Supabase will NOT keep the
login session after the page is closed/reloaded.

Therefore the login popup will appear every time the
website is opened.

The nickname is NOT authentication.
Only email + password authenticate the user.
*/

const supabase =
createClient(
SUPABASE_URL,
SUPABASE_KEY,
{
auth:{
persistSession:false,
autoRefreshToken:true,
detectSessionInUrl:true
}
}
);


/* =========================================================
STATE
========================================================= */

let user=null;

let currentProfile=null;

let profilesCache=new Map();

let boards=[];

let friends=[];

let selectedBoardId=null;

let contextBoardId=null;

let moving=null;

let resizing=null;

let panning=null;

let panX=80;

let panY=80;

let zoom=1;

let pointers=new Map();

let pinchStartDistance=null;

let pinchStartZoom=1;

let pinchStartCenter=null;

let pinchStartPanX=0;

let pinchStartPanY=0;


/* =========================================================
HELPERS
========================================================= */

function escapeHTML(value){

return String(value ?? "")

.replace(/&/g,"&amp;")

.replace(/</g,"&lt;")

.replace(/>/g,"&gt;")

.replace(/"/g,"&quot;")

.replace(/'/g,"&#039;");

}


function openModal(html){

document.getElementById("modal").innerHTML=html;

document.getElementById("modalBackground").style.display="flex";

}


function closeModal(){

document.getElementById("modalBackground").style.display="none";

}


window.closeModal=closeModal;


function showError(message){

alert(message);

}


/* =========================================================
AUTH MODE
========================================================= */

let signupMode=false;


function updateAuthUI(){

const description=
document.getElementById("authDescription");

const loginButton=
document.getElementById("loginButton");

const signupButton=
document.getElementById("signupButton");

const nickname=
document.getElementById("authNickname");


/*
Nickname ALWAYS remains visible.

It is NEVER used as authentication.
*/

nickname.style.display="block";

nickname.required=false;


if(signupMode){

description.textContent=
"Create a new Spaceboards account.";

loginButton.style.display="none";

signupButton.textContent=
"Create account";

nickname.placeholder="Nickname";

}else{

description.textContent=
"Log in to Spaceboards.";

loginButton.style.display=
"inline-block";

signupButton.textContent=
"Create account";

nickname.placeholder="Nickname";

}

}


/* =========================================================
LOGIN
========================================================= */

document.getElementById("loginButton")

.addEventListener(
"click",
async()=>{

const email=
document.getElementById("authEmail")
.value
.trim()
.toLowerCase();

const nickname=
document.getElementById("authNickname")
.value
.trim();

const password=
document.getElementById("authPassword")
.value;

const errorBox=
document.getElementById("authError");

errorBox.textContent="";


if(!email||!password){

errorBox.textContent=
"Enter your email and password.";

return;

}


/*
IMPORTANT:

Nickname is collected but is NOT passed to
Supabase authentication.

Only email + password are credentials.
*/

const {
data,
error
}=
await supabase.auth.signInWithPassword({

email:email,

password:password

});


if(error){

errorBox.textContent=
error.message;

return;

}


user=data?.user||null;


if(!user){

errorBox.textContent=
"Login failed.";

return;

}


/*
Load the real profile from Supabase.

If the user typed a nickname and the profile
doesn't have one, save it.

This is NOT authentication.
*/

await loadCurrentProfile();


if(
nickname &&
currentProfile &&
(!currentProfile.nickname ||
currentProfile.nickname.trim()==="")
){

const {
data:updatedProfile,
error:updateError
}=
await supabase

.from("profiles")

.update({

nickname:nickname

})

.eq(
"id",
user.id
)

.select()
.maybeSingle();


if(!updateError&&updatedProfile){

currentProfile=
updatedProfile;

profilesCache.set(
updatedProfile.id,
updatedProfile
);

}

}


await loadProfiles();

await loadFriends();

await loadBoards();

await loadFriendRequests();


document.getElementById("authScreen")
.style.display="none";

render();

renderFriends();

});


/* =========================================================
CREATE ACCOUNT
========================================================= */

document.getElementById("signupButton")

.addEventListener(
"click",
async()=>{


if(!signupMode){

signupMode=true;

updateAuthUI();

return;

}


const email=
document.getElementById("authEmail")
.value
.trim()
.toLowerCase();

const nickname=
document.getElementById("authNickname")
.value
.trim();

const password=
document.getElementById("authPassword")
.value;

const errorBox=
document.getElementById("authError");

errorBox.textContent="";


if(!email||!nickname||!password){

errorBox.textContent=
"Enter your email, nickname and password.";

return;

}


if(nickname.length<2){

errorBox.textContent=
"Nickname must be at least 2 characters.";

return;

}


if(nickname.length>30){

errorBox.textContent=
"Nickname must be 30 characters or less.";

return;

}


if(password.length<6){

errorBox.textContent=
"Password must be at least 6 characters.";

return;

}


/* =========================================================
CHECK NICKNAME
========================================================= */

const {
data:existingNickname,
error:nicknameError
}=
await supabase

.from("profiles")

.select("id")

.ilike(
"nickname",
nickname
)

.maybeSingle();


if(nicknameError){

console.error(
"Nickname check error:",
nicknameError
);

}


if(existingNickname){

errorBox.textContent=
"That nickname is already taken.";

return;

}


/* =========================================================
CREATE AUTH ACCOUNT
========================================================= */

const {
data,
error
}=
await supabase.auth.signUp({

email:email,

password:password

});


if(error){

errorBox.textContent=
error.message;

return;

}


/* =========================================================
SAVE PROFILE
========================================================= */

if(data?.user){

const {
data:profile,
error:profileError
}=
await supabase

.from("profiles")

.upsert({

id:data.user.id,

email:email,

nickname:nickname

},{
onConflict:"id"
})

.select()
.single();


if(profileError){

console.error(
"Profile creation error:",
profileError
);

errorBox.textContent=
"Account created, but the nickname could not be saved: "+
profileError.message;

return;

}


currentProfile=profile;

profilesCache.set(
data.user.id,
profile
);

}


errorBox.textContent=
"Account created. Check your email if confirmation is required.";

});

AUTH KEYBOARD
========================================================= */

document.getElementById("authEmail")

.addEventListener(
"keydown",
event=>{

if(event.key==="Enter"){

document.getElementById("authNickname")
.focus();

}

});


document.getElementById("authNickname")

.addEventListener(
"keydown",
event=>{

if(event.key==="Enter"){

document.getElementById("authPassword")

}

});


document.getElementById("authPassword")

event=>{

/* =========================================================
SESSION
========================================================= */

supabase.auth.onAuthStateChange(

async(event,session)=>{

/*
Because persistSession is false, a new page load
will normally have no session.

When there IS a session, load the application.
*/

user=
session?.user||null;


if(user){

document.getElementById("authScreen")
.style.display="none";


await loadCurrentProfile();

await loadProfiles();

await loadFriends();

await loadBoards();

await loadFriendRequests();

render();

renderFriends();

}else{

document.getElementById("authScreen")
.style.display="flex";

boards=[];

friends=[];

selectedBoardId=null;

currentProfile=null;

profilesCache.clear();

render();

renderFriends();

}

});


/* =========================================================
INITIAL SESSION
========================================================= */

const sessionResult=
await supabase.auth.getSession();


if(sessionResult.data.session){

/*
There is a temporary in-memory session.

Use it for the current page.
*/

user=
sessionResult.data.session.user;

document.getElementById("authScreen")
.style.display="none";

await loadCurrentProfile();

await loadProfiles();

await loadFriends();

await loadBoards();

await loadFriendRequests();

}else{

/*
NO SESSION:

Always show login screen.
*/

user=null;

document.getElementById("authScreen")
.style.display="flex";

}


/* =========================================================
LOAD CURRENT PROFILE
========================================================= */

async function loadCurrentProfile(){

if(!user)return;


const {
data,
error
}=
await supabase

.from("profiles")

.select(
"id,email,nickname"
)

.eq(
"id",
user.id
)

.maybeSingle();


if(error){

console.error(
"Current profile error:",
error
);

return;

}


if(data){

currentProfile=data;

profilesCache.set(
String(data.id),
data
);

return;

}


/*
Fallback for old accounts.
*/

const fallbackNickname=
user.email?.split("@")[0]||
"User";


const {
data:newProfile,
error:newError
}=
await supabase

.from("profiles")

.upsert({

id:user.id,

email:
user.email?.toLowerCase()||
"",

nickname:
fallbackNickname

},{
onConflict:"id"
})

.select()
.single();


if(!newError&&newProfile){

currentProfile=newProfile;

profilesCache.set(
String(newProfile.id),
newProfile
);

}

}


/* =========================================================
LOAD ALL PROFILES
========================================================= */

async function loadProfiles(){

if(!user)return;


/*
Do NOT clear our own profile.
*/

const ownProfile=currentProfile;

profilesCache.clear();


if(ownProfile){

profilesCache.set(
String(ownProfile.id),
ownProfile
);

}


const {
data,
error
}=
await supabase

.from("profiles")

.select(
"id,email,nickname"
);


if(error){

console.error(
"Could not load profiles:",
error
);

return;

}


(data||[]).forEach(profile=>{

profilesCache.set(
String(profile.id),
profile
);

});

}


/* =========================================================
GET NICKNAME
========================================================= */

function getNickname(ownerId){

if(!ownerId){

return "";

}


const profile=
profilesCache.get(
String(ownerId)
);


if(
profile &&
profile.nickname
){

return profile.nickname;

}


if(
currentProfile &&
String(currentProfile.id)===
String(ownerId)
){

return currentProfile.nickname||"";

}


return "";

}

LOGOUT
========================================================= */

document.getElementById("logoutButton")

.addEventListener(
"click",
async()=>{

await supabase.auth.signOut();

});


/* =========================================================
FRIENDS
========================================================= */

async function loadFriends(){

if(!user)return;


const {
data,
error
}=
await supabase

.from("friend_requests")

.select("*")

.or(
`sender_id.eq.${user.id},receiver_id.eq.${user.id}`
);


if(error){

console.error(error);

return;

}


const accepted=
(data||[])
.filter(
r=>
r.status==="accepted"
);


const ids=
accepted.map(
r=>
r.sender_id===user.id
?r.receiver_id
:r.sender_id
);


if(!ids.length){

friends=[];

renderFriends();

return;

}


const {
data:friendProfiles,
error:profilesError
}=
await supabase

.from("profiles")

.select(
"id,email,nickname"
)

.in(
"id",
ids
);


if(profilesError){

console.error(
profilesError
);

return;

}


friends=
friendProfiles||[];


friends.forEach(friend=>{

profilesCache.set(
String(friend.id),
friend
);

});


renderFriends();

}


/* =========================================================
RENDER FRIENDS
========================================================= */

function renderFriends(){

const list=
document.getElementById("friendsList");

list.innerHTML="";


friends.forEach(friend=>{

document.createElement("div");

element.className="friend";

element.textContent=
friend.nickname||
"Unknown user";

list.appendChild(element);

});

}

ADD FRIEND

error

email
)

profile
);


const {
data:existing
}=
await supabase

.from("friend_requests")

.select(

)

.or(
`and(sender_id.eq.${user.id},receiver_id.eq.${profile.id}),and(sender_id.eq.${profile.id},receiver_id.eq.${user.id})`
);


if(existing&&existing.length){

existing.some(
request=>
request.status==="accepted"
);

"You are already friends with this user."
);

existing.some(
request=>
request.status==="pending"
);

if(hasPending){

showError(
"A friend request already exists."
);

return;

}

}


const {
error:insertError
}=
await supabase

.from("friend_requests")

.insert({

sender_id:user.id,

receiver_id:profile.id,

status:"pending"

});


if(insertError){

showError(
insertError.message
);

return;

}


input.value="";


showError(
"Friend request sent."
);

});


/* =========================================================
FRIEND REQUESTS
========================================================= */

document.getElementById("friendRequestsButton")

.addEventListener(
"click",
async()=>{

const panel=
document.getElementById("requestsPanel");


if(panel.style.display==="block"){

panel.style.display="none";

return;

}


panel.style.display="block";

await loadFriendRequests();

async function loadFriendRequests(){

if(!user)return;


const list=
document.getElementById("requestsList");

list.innerHTML="Loading...";


const {
data:requests,
error
}=
await supabase

.from("friend_requests")

.select("*")

.eq(
"receiver_id",
user.id
)

.eq(
"status",
"pending"
);


if(error){

list.innerHTML=
`<div style="color:#c00">
${escapeHTML(error.message)}
</div>`;

return;

}


if(
!requests||
requests.length===0
){

list.innerHTML=
"<p style='font-size:13px;color:#666'>No pending requests.</p>";

return;

}


const ids=
requests.map(
request=>
request.sender_id
);


const {
data:requestProfiles
}=
await supabase

.from("profiles")

.select(
"id,email,nickname"
)

.in(
"id",
ids
);


(requestProfiles||[]).forEach(profile=>{

profilesCache.set(
String(profile.id),
profile
);

});


list.innerHTML="";


requests.forEach(request=>{

const sender=
(requestProfiles||[])
.find(
profile=>
String(profile.id)===
String(request.sender_id)
);


const row=
document.createElement("div");

row.className="request";


row.innerHTML=`

<div class="request-nickname">

${escapeHTML(
sender?.nickname||
"Unknown user"
)}

</div>


<div class="request-actions">

<button
data-action="accept"
data-id="${request.id}">
Accept
</button>

<button
data-action="decline"
data-id="${request.id}">
Decline
</button>

</div>

`;


list.appendChild(row);

});

}

/* =========================================================
SAVE URL
========================================================= */

async function saveURL(
board,
visibility
){

let url=
document.getElementById("urlAddress")
.value
.trim();


const title=
document.getElementById("urlTitle")
.value
.trim();


const image=
document.getElementById("urlImage")
.value
.trim();


if(!url){

showError(
"Enter a URL."
);

return;

}


if(!/^https?:\/\//i.test(url)){

url=
"https://"+url;

}


/*
Make sure we have the current nickname.
*/

await loadCurrentProfile();


const ownerNickname=
currentProfile?.nickname||
getNickname(board.owner_id)||
"";


/*
The nickname is stored directly with the
URL item.

This means the nickname stays attached to
the URL instead of depending entirely on
the profile cache.
*/

const insertData={

box_id:board.id,

title:
title||
url,

url:url,

image:
image||
null,

visibility:visibility,

owner_nickname:
ownerNickname

};


let {
data,
error
}=
await supabase

.from("box_items")

.insert(insertData)

.select()

.single();


/*
If your existing box_items table does NOT
yet have owner_nickname, the insert will fail.

In that case we retry using the original
columns so the rest of the website still
works.
*/

if(
error &&
(
error.code==="42703" ||
String(error.message)
.toLowerCase()
.includes("owner_nickname")
)
){

const fallback=
await supabase

.from("box_items")

.insert({

box_id:board.id,

title:
title||
url,

url:url,

image:
image||
null,

visibility:visibility

})

.select()
.single();


data=fallback.data;

error=fallback.error;

}


if(error){

showError(
"Could not save URL: "+
error.message
);

return;

}


if(!data){

showError(
"Could not save URL."
);

return;

}


/*
Attach nickname locally even if the
database doesn't have the new column.
*/

data.owner_nickname=
ownerNickname;


board.ownerNickname=
ownerNickname||
board.ownerNickname||
"";


board.items.push(data);


closeModal();

render();

}


/* =========================================================
DELETE URL
========================================================= */

async function deleteURL(
board,
itemId
){

const confirmed=
confirm(
"Delete this URL?"
);


if(!confirmed)return;


const {
error
}=
await supabase

.from("box_items")

.delete()

.eq(
"id",
itemId
)

.eq(
"box_id",
board.id
);


if(error){

showError(
"Could not delete URL: "+
error.message
);

return;

}


board.items=
board.items.filter(
item=>
String(item.id)!==
String(itemId)
);


render();

}

async function deleteBoard(board){

if(!user){

showError(
"You must be logged in."
);

return;

}


if(
String(board.owner_id)!==
String(user.id)
){

showError(
"You can only delete your own boxes."
);

return;

}


const confirmed=
confirm(
"Delete this box and all of its URLs?"
);


if(!confirmed)return;


const {
error:itemError
}=
await supabase

.from("box_items")

.delete()

.eq(
"box_id",
board.id
);


if(itemError){

showError(
"Could not delete the URLs in this box: "+
itemError.message
);

return;

}


const {
data:deleted,
error:boxError
}=
await supabase

.from("boxes")

.delete()

.eq(
"id",
board.id
)

.eq(
"owner_id",
user.id
)

.select();


if(boxError){

showError(
"Could not delete box: "+
boxError.message
);

return;

}


if(
!deleted||
deleted.length===0
){

showError(
"Supabase did not allow this box to be deleted. Check the DELETE policy for the boxes table."
);

return;

}


boards=
boards.filter(
b=>
String(b.id)!==
String(board.id)
);


if(
String(selectedBoardId)===
String(board.id)
){

selectedBoardId=null;

}


render();

}


/* =========================================================
RENDER
========================================================= */

function render(){

const world=
document.getElementById("world");


world.style.transform=
`translate(${panX}px,${panY}px) scale(${zoom})`;


world.innerHTML="";


if(!user){

return;

}


boards.forEach(board=>{

const element=
document.createElement("section");


element.className=
"board"+
(
String(selectedBoardId)===
String(board.id)
?" selected"
:""
);


element.dataset.id=
board.id;


element.style.left=
Number(board.x)+"px";


element.style.top=
Number(board.y)+"px";


element.style.width=
Number(board.w)+"px";


element.style.height=
Number(board.h)+"px";


const owner=
String(board.owner_id)===
String(user?.id);


/*
NICKNAME PRIORITY:

1. nickname stored on URL item
2. board owner nickname
3. current profile if this is our board
4. profile cache
5. blank

We NEVER show "Unknown user" here.
*/

let boardNickname=
board.ownerNickname||
"";


if(
owner&&
currentProfile?.nickname
){

boardNickname=
currentProfile.nickname;

}


if(!boardNickname){

boardNickname=
getNickname(
board.owner_id
)||"";

}


element.innerHTML=`

<div class="board-title">

${escapeHTML(board.title)}

</div>


${
owner
?
`
<div class="board-actions">

<button
class="trash-button"
title="Delete box"
data-delete-board="${board.id}">
🗑
</button>

</div>
`
:""
}


<div class="board-inner">


${
owner
?
`
<button
class="add-url"
data-add-url="${board.id}">
+ Add URL
</button>
`
:""
}


${
board.items.map(item=>{


/*
For each URL, first use the nickname
saved directly with that URL.

If an old URL doesn't have it, use
the board owner's nickname.
*/

const itemNickname=
item.owner_nickname||
boardNickname||
"";


return `

<div
class="item"
data-item-id="${item.id}"
data-url="${escapeHTML(item.url)}">


${
item.image
?
`
<img
src="${escapeHTML(item.image)}"
alt=""
>
`
:""
}


<div class="item-content">

<div class="item-nickname">

${escapeHTML(
itemNickname
)}

</div>


<div class="item-title">

${escapeHTML(
item.title||
item.url
)}

</div>

</div>


<span class="item-visibility">

${item.visibility==="public"
?"Public"
:"Private"}

</span>


${
owner
?
`
<button
class="item-trash"
title="Delete URL"
data-delete-item="${item.id}">
🗑
</button>
`
:""
}


</div>

`;

}).join("")
}


</div>


${
owner
?
`
<div class="resize"></div>
`
:""
}

`;


/* BOARD CLICK */

element.addEventListener(
"click",
event=>{

if(
event.target.closest(
".trash-button"
)
)return;

if(
event.target.closest(
".item-trash"
)
)return;

if(
event.target.closest(
".add-url"
)
)return;

if(
event.target.closest(
".resize"
)
)return;

selectedBoardId=
board.id;

render();

});


/* DELETE BUTTON */

const deleteBoardButton=
element.querySelector(
"[data-delete-board]"
);


if(deleteBoardButton){

deleteBoardButton.addEventListener(
"click",
async event=>{

event.preventDefault();

event.stopPropagation();

await deleteBoard(board);

});

}


/* ADD URL */

const addButton=
element.querySelector(
"[data-add-url]"
);


if(addButton){

addButton.addEventListener(
"click",
event=>{

event.preventDefault();

event.stopPropagation();

openURLModal(
board
);

});

}


/* DELETE URL */

element

.querySelectorAll(
"[data-delete-item]"
)

.forEach(button=>{

button.addEventListener(
"click",
async event=>{

event.preventDefault();

event.stopPropagation();

await deleteURL(
board,
button.dataset.deleteItem
);

});

});


/* OPEN URL */

element

.querySelectorAll(".item")

.forEach(item=>{

item.addEventListener(
"click",
event=>{

if(
event.target.closest(
".item-trash"
)
)return;

const url=
item.dataset.url;


if(url){

window.open(
url,
"_blank"
);

}

});

});


/* CONTEXT MENU */

element.addEventListener(
"contextmenu",
event=>{

if(!owner)return;

event.preventDefault();

contextBoardId=
board.id;


const menu=
document.getElementById(
"contextMenu"
);


menu.style.display=
"block";


menu.style.left=
event.clientX+"px";


menu.style.top=
event.clientY+"px";

});


/* MOVE + RESIZE */

if(owner){

element.addEventListener(
"pointerdown",
event=>{

if(
event.pointerType==="touch"
)return;


if(
event.target.closest(".item")
)return;


if(
event.target.closest(".add-url")
)return;


if(
event.target.closest(".trash-button")
)return;


if(
event.target.closest(".resize")
){

resizing={

id:
board.id,

startX:
event.clientX,

startY:
event.clientY,

width:
board.w,

height:
board.h

};


element.setPointerCapture(
event.pointerId
);

return;

}


moving={

id:
board.id,

startX:
event.clientX,

startY:
event.clientY,

x:
board.x,

y:
board.y

};


element.setPointerCapture(
event.pointerId
);

});


element.addEventListener(
"pointermove",
event=>{

if(
resizing?.id===
board.id
){

board.w=
Math.max(
180,
resizing.width+
(
event.clientX-
resizing.startX
)/zoom
);


board.h=
Math.max(
120,
resizing.height+
(
event.clientY-
resizing.startY
)/zoom
);


render();

return;

}


if(
moving?.id===
board.id
){

board.x=
moving.x+
(
event.clientX-
moving.startX
)/zoom;


board.y=
moving.y+
(
event.clientY-
moving.startY
)/zoom;


render();

}

});


element.addEventListener(
"pointerup",
async()=>{

if(moving){

await supabase

.from("boxes")

.update({

x:board.x,

y:board.y

})

.eq(
"id",
board.id
)

.eq(
"owner_id",
user.id
);

}


if(resizing){

await supabase

.from("boxes")

.update({

width:board.w,

height:board.h

})

.eq(
"id",
board.id
)

.eq(
"owner_id",
user.id
);

}


moving=null;

resizing=null;

});

}


world.appendChild(
element
);

});

}


/* =========================================================
DESKTOP PAN
========================================================= */

const workspace=
document.getElementById(
"workspace"
);


workspace.addEventListener(
"pointerdown",
event=>{

if(
event.pointerType==="touch"
)return;


if(
event.target.closest(".board")
)return;


panning={

x:
event.clientX,

y:
event.clientY,

panX:
panX,

panY:
panY

};

});


document.addEventListener(
"pointermove",
event=>{

if(!panning)return;


panX=
panning.panX+
event.clientX-
panning.x;


panY=
panning.panY+
event.clientY-
panning.y;


render();

});


document.addEventListener(
"pointerup",
()=>{
panning=null;
});


/* =========================================================
TOUCH PAN + PINCH
========================================================= */

function distance(a,b){

return Math.hypot(
a.clientX-b.clientX,
a.clientY-b.clientY
);

}


function midpoint(a,b){

return{

x:
(a.clientX+b.clientX)/2,

y:
(a.clientY+b.clientY)/2

};

}


workspace.addEventListener(
"pointerdown",
event=>{

if(
event.pointerType!=="touch"
)
return;


pointers.set(
event.pointerId,
{

clientX:
event.clientX,

clientY:
event.clientY

}
);


if(
pointers.size===1
){

if(
!event.target.closest(".board")
){

panning={

x:
event.clientX,

y:
event.clientY,

panX:
panX,

panY:
panY

};

}

}


if(
pointers.size===2
){

panning=null;


const points=
[...pointers.values()];


pinchStartDistance=
distance(
points[0],
points[1]
);


pinchStartZoom=
zoom;


pinchStartCenter=
midpoint(
points[0],
points[1]
);


pinchStartPanX=
panX;

pinchStartPanY=
panY;

}

});


workspace.addEventListener(
"pointermove",
event=>{

if(
event.pointerType!=="touch"
)
return;


if(
!pointers.has(
event.pointerId
)
)
return;


pointers.set(
event.pointerId,
{

clientX:
event.clientX,

clientY:
event.clientY

}
);


if(
pointers.size===1&&
panning
){

panX=
panning.panX+
event.clientX-
panning.x;


panY=
panning.panY+
event.clientY-
panning.y;


render();

return;

}


if(
pointers.size===2
){

const points=
[...pointers.values()];


const currentDistance=
distance(
points[0],
points[1]
);


if(!pinchStartDistance)
return;


let newZoom=
pinchStartZoom*
(
currentDistance/
pinchStartDistance
);


newZoom=
Math.max(
0.25,
Math.min(
3,
newZoom
)
);


const center=
midpoint(
points[0],
points[1]
);


const rect=
workspace.getBoundingClientRect();


const worldX=
(
pinchStartCenter.x-
rect.left-
pinchStartPanX
)/
pinchStartZoom;


const worldY=
(
pinchStartCenter.y-
rect.top-
pinchStartPanY
)/
pinchStartZoom;


panX=
center.x-
rect.left-
worldX*newZoom;


panY=
center.y-
rect.top-
worldY*newZoom;


zoom=
newZoom;


render();

}

});


function endTouch(event){

if(
event.pointerType!=="touch"
)
return;


pointers.delete(
event.pointerId
);


if(
pointers.size<2
){

pinchStartDistance=
null;

}


if(
pointers.size===0
){

panning=null;

}

}


workspace.addEventListener(
"pointerup",
endTouch
);


workspace.addEventListener(
"pointercancel",
endTouch
);


/* =========================================================
MOUSE WHEEL ZOOM
========================================================= */

workspace.addEventListener(
"wheel",
event=>{

event.preventDefault();


const rect=
workspace.getBoundingClientRect();


const mouseX=
event.clientX-
rect.left;


const mouseY=
event.clientY-
rect.top;


const worldX=
(mouseX-panX)/
zoom;


const worldY=
(mouseY-panY)/
zoom;


const factor=
event.deltaY<0
?1.1
:0.9;


zoom=
Math.max(
0.25,
Math.min(
3,
zoom*factor
)
);


panX=
mouseX-
worldX*zoom;


panY=
mouseY-
worldY*zoom;


render();

},
{
passive:false
}
);


/* =========================================================
CONTEXT MENU CLOSE
========================================================= */

document.addEventListener(
"pointerdown",
event=>{

if(
!event.target.closest(
"#contextMenu"
)
){

document.getElementById(
"contextMenu"
).style.display=
"none";

}

});


/* =========================================================
RENAME
========================================================= */

document.getElementById(
"renameOption"
)

.addEventListener(
"click",
async()=>{

document.getElementById(
"contextMenu"
).style.display=
"none";


const board=
boards.find(
b=>
String(b.id)===
String(contextBoardId)
);


if(!board)return;


if(
String(board.owner_id)!==
String(user.id)
){

showError(
"You can only rename your own boxes."
);

return;

}


openModal(`

<h2>Rename box</h2>


<input
id="renameInput"
value="${escapeHTML(board.title)}"
>


<div class="modal-actions">

<button id="renameCancel">
Cancel
</button>

<button id="renameSave">
Save
</button>

</div>

`);


document.getElementById(
"renameCancel"
)
.onclick=
closeModal;


document.getElementById(
"renameSave"
)
.onclick=
async()=>{

const title=
document.getElementById(
"renameInput"
)
.value
.trim();


if(!title)return;


const {
error
}=
await supabase

.from("boxes")

.update({

title:
title

})

.eq(
"id",
board.id
)

.eq(
"owner_id",
user.id
);


if(error){

showError(
error.message
);

return;

}


board.title=
title;


closeModal();


render();

};

});


/* =========================================================
DELETE FROM CONTEXT MENU
========================================================= */

document.getElementById(
"deleteOption"
)

.addEventListener(
"click",
async()=>{

document.getElementById(
"contextMenu"
).style.display=
"none";


const board=
boards.find(
b=>
String(b.id)===
String(contextBoardId)
);


if(board){

await deleteBoard(
board
);

}

});


/* =========================================================
SEARCH
========================================================= */

document.getElementById(
"searchInput"
)

.addEventListener(
"input",
event=>{

const query=
event.target.value
.toLowerCase()
.trim();


document

.querySelectorAll(
".board"
)

.forEach(element=>{

const board=
boards.find(
b=>
String(b.id)===
String(element.dataset.id)
);


if(!board)return;


const matches=
!query||

board.title
.toLowerCase()
.includes(query)||

board.items.some(
item=>
(item.title||"")
.toLowerCase()
.includes(query)||

(item.url||"")
.toLowerCase()
.includes(query)
);


element.style.opacity=
matches
?"1"
:"0.2";

});

});


/* =========================================================
SHARE
========================================================= */

document.getElementById(
"shareButton"
)

.addEventListener(
"click",
async()=>{

const data={

title:
"Spaceboards",

text:
"Check out my Spaceboards!",

url:
window.location.href

};


try{

if(
navigator.share
){

await navigator.share(
data
);

}else{

await navigator.clipboard.writeText(
window.location.href
);


alert(
"Website link copied to clipboard."
);

}

}catch(error){

if(
error.name!=="AbortError"
){

try{

await navigator.clipboard.writeText(
window.location.href
);


alert(
"Website link copied to clipboard."
);

}catch(e){

prompt(
"Copy this link:",
window.location.href
);

}

}

}

});


/* =========================================================
MODAL CLOSE
========================================================= */

document.getElementById(
"modalBackground"
)

.addEventListener(
"click",
event=>{

if(
event.target.id===
"modalBackground"
){

closeModal();

}

});


/* =========================================================
INITIAL AUTH UI
========================================================= */

updateAuthUI();


/* =========================================================
INITIAL RENDER
========================================================= */

render();

</script>
