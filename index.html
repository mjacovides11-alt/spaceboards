<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Spaceboards</title>

<style>
*{box-sizing:border-box}

html,body{
margin:0;
width:100%;
height:100%;
font-family:Arial,sans-serif;
background:#fafafa;
color:#111;
overflow:hidden
}

button,input{font:inherit}

button{
border:1px solid #bbb;
background:#fff;
border-radius:7px;
padding:8px 12px;
cursor:pointer
}

button:hover{background:#f1f1f1}

.topbar{
height:58px;
display:flex;
align-items:center;
gap:7px;
padding:8px 12px;
background:#fff;
border-bottom:1px solid #ddd;
position:relative;
z-index:50
}

.logo{
font-weight:bold;
margin-left:5px
}

.spacer{flex:1}

.search,.add-friend{
padding:9px 10px;
border:1px solid #bbb;
border-radius:7px
}

.search{width:190px}
.add-friend{width:145px}

.friends{
display:flex;
align-items:center;
gap:5px;
max-width:220px;
overflow-x:auto
}

.friend{
padding:6px 9px;
border:1px solid #ddd;
border-radius:15px;
background:#f7f7f7;
white-space:nowrap;
font-size:12px
}

#requestsPanel{
position:fixed;
top:65px;
right:12px;
width:300px;
max-height:400px;
overflow:auto;
background:#fff;
border:1px solid #ccc;
border-radius:10px;
box-shadow:0 8px 30px #0003;
z-index:200;
display:none;
padding:12px
}

#requestsPanel h3{
margin:3px 0 12px
}

.request{
display:flex;
align-items:center;
justify-content:space-between;
gap:8px;
padding:9px 0;
border-bottom:1px solid #eee
}

.request-nickname{
font-size:13px;
overflow:hidden;
text-overflow:ellipsis;
white-space:nowrap
}

.request-actions{
display:flex;
gap:5px
}

.request-actions button{
padding:6px 8px;
font-size:12px
}

#workspace{
position:absolute;
top:58px;
left:0;
right:0;
bottom:0;
overflow:hidden;
background:#fafafa;
touch-action:none;
cursor:grab
}

#workspace:active{
cursor:grabbing
}

#world{
position:absolute;
width:1px;
height:1px;
transform-origin:0 0
}

.board{
position:absolute;
background:#fff;
border:1px solid #aaa;
border-radius:10px;
box-shadow:0 2px 10px #00000012
}

.board.selected{
outline:2px solid #222
}

.board-title{
position:absolute;
top:-31px;
left:10px;
font-size:14px;
font-weight:bold;
white-space:nowrap
}

.board-actions{
position:absolute;
top:7px;
right:7px;
z-index:20
}

.trash-button{
width:30px;
height:30px;
padding:0;
display:flex;
align-items:center;
justify-content:center;
font-size:16px
}

.trash-button:hover{
background:#ffecec
}

.board-inner{
width:100%;
height:100%;
padding:45px 12px 12px;
overflow:auto;
border-radius:10px
}

.add-url{
width:100%;
margin-bottom:9px;
padding:7px;
font-size:12px
}

.item{
position:relative;
display:inline-flex;
align-items:center;
gap:8px;
max-width:100%;
margin:4px;
padding:8px 32px 8px 9px;
border:1px solid #ddd;
background:#fff;
border-radius:7px;
cursor:pointer;
word-break:break-word
}

.item:hover{
background:#f5f5f5
}

.item img{
width:34px;
height:34px;
object-fit:cover;
border-radius:5px
}

.item-content{
display:flex;
flex-direction:column;
min-width:0
}

.item-nickname{
font-size:9px;
color:#777;
line-height:11px;
margin-bottom:2px;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
max-width:220px
}

.item-title{
font-size:13px;
word-break:break-word
}

.item-visibility{
position:absolute;
top:2px;
right:5px;
font-size:9px;
color:#777
}

.item-trash{
position:absolute;
right:4px;
bottom:2px;
border:0;
background:transparent;
padding:1px 3px;
font-size:11px;
cursor:pointer
}

.item-trash:hover{
background:#eee
}

.resize{
position:absolute;
width:12px;
height:12px;
right:-6px;
bottom:-6px;
background:#fff;
border:1px solid #777;
border-radius:3px;
cursor:nwse-resize
}

.auth{
position:fixed;
inset:0;
background:#fff;
display:flex;
align-items:center;
justify-content:center;
z-index:500
}

.auth-box{
width:min(400px,92vw);
border:1px solid #ddd;
border-radius:12px;
padding:25px;
box-shadow:0 5px 30px #0001
}

.auth-box input{
width:100%;
padding:11px;
margin:6px 0 10px;
border:1px solid #aaa;
border-radius:7px
}

.auth-error{
color:#c00;
font-size:13px;
min-height:20px;
margin-bottom:8px
}

.modal-bg{
position:fixed;
inset:0;
background:#0008;
display:none;
align-items:center;
justify-content:center;
z-index:300
}

.modal{
width:min(440px,92vw);
background:#fff;
border-radius:12px;
padding:20px;
box-shadow:0 15px 50px #0004
}

.modal h2{
margin-top:0
}

.modal input{
width:100%;
padding:10px;
margin:5px 0 12px;
border:1px solid #aaa;
border-radius:7px
}

.modal-actions{
display:flex;
justify-content:flex-end;
gap:8px
}

.choice{
display:flex;
gap:10px;
margin:15px 0
}

.choice button{
flex:1;
padding:14px
}

.menu{
position:fixed;
display:none;
min-width:160px;
background:#fff;
border:1px solid #aaa;
border-radius:7px;
box-shadow:0 5px 20px #0003;
z-index:400
}

.menu div{
padding:10px 13px;
cursor:pointer
}

.menu div:hover{
background:#eee
}

.hint{
position:fixed;
left:12px;
bottom:12px;
background:#fff;
border:1px solid #ddd;
border-radius:8px;
padding:8px 10px;
font-size:12px;
color:#555;
z-index:10
}

@media(max-width:900px){

.search{
width:130px
}

.add-friend{
width:110px
}

.friends{
max-width:150px
}

}

@media(max-width:600px){

.logo{
display:none
}

.search{
width:85px
}

.add-friend{
width:95px
}

.friends{
display:none
}

.topbar button{
padding:7px
}

#requestsPanel{
right:6px;
width:290px
}

}
</style>
</head>

<body>

<!-- LOGIN / SIGN UP -->

<div class="auth" id="authScreen">

<div class="auth-box">

<h1>Spaceboards</h1>

<p id="authDescription">
Create an account or log in.
</p>

<input
id="authEmail"
type="email"
placeholder="Email"
autocomplete="email"
>

<input
id="authNickname"
type="text"
placeholder="Nickname"
autocomplete="nickname"
style="display:none"
>

<input
id="authPassword"
type="password"
placeholder="Password"
autocomplete="current-password"
>

<div id="authError" class="auth-error"></div>

<button id="loginButton">
Log in
</button>

<button id="signupButton">
Create account
</button>

</div>

</div>


<!-- TOP BAR -->

<header class="topbar">

<div class="logo">
Spaceboards
</div>

<button id="newUrlButton">
New URL
</button>

<button id="newBoxButton">
New Box
</button>

<button id="shareButton">
Share
</button>

<input
id="addFriendInput"
class="add-friend"
placeholder="Add friends"
>

<button id="addFriendButton">
Add
</button>

id="searchInput"

>

</button>

<div id="requestsPanel">

</div>

</main>

</div>

Rename
</div>

Delete
</div>

</div>

<div id="modalBackground" class="modal-bg">

</div>


<script type="module">

import {
createClient
}
from
"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";


/* =========================================================
SUPABASE
========================================================= */

const SUPABASE_URL =
"https://uqpivlamfwbjoqvordcm.supabase.co";

const SUPABASE_KEY =
"sb_publishable_8CryzR2sR-y5nHprgLWJlA_Wfy_mTrj";

const supabase =
createClient(
SUPABASE_URL,
SUPABASE_KEY
);


/* =========================================================
STATE
========================================================= */

let user=null;
let currentProfile=null;
let boards=[];
let friends=[];
let selectedBoardId=null;
let contextBoardId=null;
let moving=null;
let resizing=null;
let panning=null;

let panX=80;
let panY=80;
let zoom=1;

let pointers=new Map();

let pinchStartDistance=null;
let pinchStartZoom=1;
let pinchStartCenter=null;
let pinchStartPanX=0;
let pinchStartPanY=0;


/* =========================================================
HELPERS
========================================================= */

function escapeHTML(value){

return String(value)

.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


function openModal(html){

document.getElementById("modal").innerHTML=html;

document.getElementById("modalBackground").style.display="flex";

}


function closeModal(){

document.getElementById("modalBackground").style.display="none";

}


window.closeModal=closeModal;


function showError(message){

alert(message);

}


/* =========================================================
AUTH MODE
========================================================= */

let signupMode=false;


function updateAuthUI(){

const nickname=
document.getElementById("authNickname");

const description=
document.getElementById("authDescription");

const loginButton=
document.getElementById("loginButton");

const signupButton=
document.getElementById("signupButton");

if(signupMode){

nickname.style.display="block";
nickname.required=true;

description.textContent=
"Create a new Spaceboards account.";

loginButton.style.display="none";

signupButton.textContent=
"Create account";

}else{

nickname.style.display="none";
nickname.required=false;

description.textContent=
"Log in to Spaceboards.";

loginButton.style.display="inline-block";

signupButton.textContent=
"Create account";

}

}


/* =========================================================
LOGIN
========================================================= */

document.getElementById("loginButton")
.addEventListener(
"click",
async()=>{

const email=
document.getElementById("authEmail")
.value
.trim();

const password=
document.getElementById("authPassword")
.value;

const errorBox=
document.getElementById("authError");

errorBox.textContent="";

if(!email||!password){

errorBox.textContent=
"Enter your email and password.";

return;

}

const {error}=
await supabase.auth.signInWithPassword({

email:email,
password:password

});

if(error){

errorBox.textContent=
error.message;

}

});


/* =========================================================
CREATE ACCOUNT
========================================================= */

document.getElementById("signupButton")
.addEventListener(
"click",
async()=>{

if(!signupMode){

signupMode=true;

updateAuthUI();

return;

}

const email=
document.getElementById("authEmail")
.value
.trim()
.toLowerCase();

const nickname=
document.getElementById("authNickname")
.value
.trim();

const password=
document.getElementById("authPassword")
.value;

const errorBox=
document.getElementById("authError");

errorBox.textContent="";


if(!email||!nickname||!password){

errorBox.textContent=
"Enter your email, nickname and password.";

return;

}


if(nickname.length<2){

errorBox.textContent=
"Nickname must be at least 2 characters.";

return;

}


if(nickname.length>30){

errorBox.textContent=
"Nickname must be 30 characters or less.";

return;

}


if(password.length<6){

errorBox.textContent=
"Password must be at least 6 characters.";

return;

}


/* CHECK NICKNAME */

const {data:existingNickname,error:nicknameError}=
await supabase
.from("profiles")
.select("id")
.ilike("nickname",nickname)
.maybeSingle();


if(nicknameError){
console.error(nicknameError);
}


if(existingNickname){

errorBox.textContent=
"That nickname is already taken.";

return;

}


/* CREATE ACCOUNT */

const {data,error}=
await supabase.auth.signUp({

email:email,
password:password

});


if(error){

errorBox.textContent=
error.message;

return;

}


if(data?.user){

const {error:profileError}=
await supabase
.from("profiles")
.upsert({

id:data.user.id,
email:email,
nickname:nickname

},{
onConflict:"id"
});


if(profileError){

console.error(profileError);

errorBox.textContent=
"Account created, but the profile could not be saved: "+
profileError.message;

return;

}

}


errorBox.textContent=
"Account created. Check your email if confirmation is required.";

});


/* =========================================================
ENTER KEY
========================================================= */

document.getElementById("authEmail")
.addEventListener(
"keydown",
event=>{

if(event.key==="Enter"){

if(signupMode){

document.getElementById("authNickname").focus();

}else{

document.getElementById("authPassword").focus();

}

}

});


/* =========================================================
SESSION
========================================================= */

supabase.auth.onAuthStateChange(

async(event,session)=>{

user=
session?.user||null;

if(user){

document.getElementById("authScreen")
.style.display="none";

await loadCurrentProfile();
await loadFriends();
await loadBoards();
await loadFriendRequests();

}else{

document.getElementById("authScreen")
.style.display="flex";

boards=[];
friends=[];
selectedBoardId=null;
currentProfile=null;

render();
renderFriends();

}

});


/* =========================================================
INITIAL SESSION
========================================================= */

const sessionResult=
await supabase.auth.getSession();


if(sessionResult.data.session){

user=
sessionResult.data.session.user;

document.getElementById("authScreen")
.style.display="none";

await loadCurrentProfile();
await loadFriends();
await loadBoards();
await loadFriendRequests();

}


/* =========================================================
LOAD PROFILE
========================================================= */

async function loadCurrentProfile(){

if(!user)return;


const {data,error}=
await supabase
.from("profiles")
.select("id,email,nickname")
.eq("id",user.id)
.maybeSingle();


if(error){

console.error(error);
return;

}


currentProfile=data;


if(!currentProfile){

const {data:newProfile,error:newError}=
await supabase
.from("profiles")
.upsert({

id:user.id,
email:user.email?.toLowerCase()||"",
nickname:user.email?.split("@")[0]||"User"

},{
onConflict:"id"
})
.select()
.single();


if(!newError){

currentProfile=newProfile;

}

}

}


/* =========================================================
LOGOUT
========================================================= */

document.getElementById("logoutButton")
.addEventListener(
"click",
async()=>{

await supabase.auth.signOut();

});


/* =========================================================
FRIENDS
========================================================= */

async function loadFriends(){

if(!user)return;


const {data,error}=
await supabase
.from("friend_requests")
.select("*")
.or(
`sender_id.eq.${user.id},receiver_id.eq.${user.id}`
);


if(error){

console.error(error);
return;

}


const accepted=
(data||[])
.filter(
r=>r.status==="accepted"
);


const ids=
accepted.map(
r=>
r.sender_id===user.id
?r.receiver_id
:r.sender_id
);


if(!ids.length){

friends=[];
renderFriends();
return;

}


const {data:profiles,error:profilesError}=
await supabase
.from("profiles")
.select("id,email,nickname")
.in("id",ids);


if(profilesError){

console.error(profilesError);
return;

}


friends=profiles||[];

renderFriends();

}


/* =========================================================
RENDER FRIENDS
========================================================= */

function renderFriends(){

const list=
document.getElementById("friendsList");

list.innerHTML="";


friends.forEach(friend=>{

const element=
document.createElement("div");

element.className="friend";

element.textContent=
friend.nickname||
"Unknown user";

list.appendChild(element);

});

}


/* =========================================================
ADD FRIEND
========================================================= */

document.getElementById("addFriendButton")
.addEventListener(
"click",
async()=>{

const input=
document.getElementById("addFriendInput");

const email=
input.value
.trim()
.toLowerCase();


if(!email){

showError("Enter your friend's email.");
return;

}


if(email===user.email.toLowerCase()){

showError("You cannot add yourself.");
return;

}


const {data:profile,error}=
await supabase
.from("profiles")
.select("id,email,nickname")
.eq("email",email)
.maybeSingle();


if(error){

showError(error.message);
return;

}


if(!profile){

showError(
"No user with that email was found."
);

return;

}


const {data:existing}=
await supabase
.from("friend_requests")
.select("id,status")
.or(
`and(sender_id.eq.${user.id},receiver_id.eq.${profile.id}),and(sender_id.eq.${profile.id},receiver_id.eq.${user.id})`
);


if(existing&&existing.length){

if(existing.some(r=>r.status==="accepted")){

showError(
"You are already friends with this user."
);

return;

}

if(existing.some(r=>r.status==="pending")){

showError(
"A friend request already exists."
);

return;

}

}


const {error:insertError}=
await supabase
.from("friend_requests")
.insert({

sender_id:user.id,
receiver_id:profile.id,
status:"pending"

});


if(insertError){

showError(insertError.message);
return;

}


input.value="";

showError("Friend request sent.");

});


/* =========================================================
FRIEND REQUESTS
========================================================= */

document.getElementById("friendRequestsButton")
.addEventListener(
"click",
async()=>{

const panel=
document.getElementById("requestsPanel");


if(panel.style.display==="block"){

panel.style.display="none";
return;

}


panel.style.display="block";

await loadFriendRequests();

});


async function loadFriendRequests(){

if(!user)return;


const list=
document.getElementById("requestsList");

list.innerHTML="Loading...";


const {data:requests,error}=
await supabase
.from("friend_requests")
.select("*")
.eq("receiver_id",user.id)
.eq("status","pending");


if(error){

list.innerHTML=
`<div style="color:#c00">
${escapeHTML(error.message)}
</div>`;

return;

}


if(!requests||requests.length===0){

list.innerHTML=
"<p style='font-size:13px;color:#666'>No pending requests.</p>";

return;

}


const ids=
requests.map(
request=>request.sender_id
);


const {data:profiles}=
await supabase
.from("profiles")
.select("id,email,nickname")
.in("id",ids);


list.innerHTML="";


requests.forEach(request=>{

const sender=
(profiles||[])
.find(
profile=>
profile.id===request.sender_id
);


const row=
document.createElement("div");

row.className="request";


row.innerHTML=`

<div class="request-nickname">
${escapeHTML(
sender?.nickname||
"Unknown user"
)}
</div>

<div class="request-actions">

<button
data-action="accept"
data-id="${request.id}">
Accept
</button>

<button
data-action="decline"
data-id="${request.id}">
Decline
</button>

</div>

`;


list.appendChild(row);

});

}


/* =========================================================
REQUEST ACTIONS
========================================================= */

document.getElementById("requestsList")
.addEventListener(
"click",
async event=>{

const button=
event.target.closest("button");

if(!button)return;


const id=
button.dataset.id;

const action=
button.dataset.action;


if(action==="accept"){

const {error}=
await supabase
.from("friend_requests")
.update({
status:"accepted"
})
.eq("id",id)
.eq("receiver_id",user.id);


if(error){

showError(error.message);
return;

}


await loadFriends();
await loadFriendRequests();

}


if(action==="decline"){

const {error}=
await supabase
.from("friend_requests")
.delete()
.eq("id",id)
.eq("receiver_id",user.id);


if(error){

showError(error.message);
return;

}


await loadFriendRequests();

}

});


/* =========================================================
LOAD BOXES + URL OWNER
========================================================= */

async function loadBoards(){

if(!user)return;


const {data,error}=
await supabase
.from("boxes")
.select(`
id,
owner_id,
title,
x,
y,
width,
height,
created_at,
visibility,
box_items(
id,
box_id,
owner_id,
title,
url,
image,
visibility
)
`)
.order("created_at");


if(error){

console.error(error);
showError(error.message);
return;

}


boards=
(data||[])
.map(box=>{

const items=
Array.isArray(box.box_items)
?box.box_items
:[];


return{

...box,

w:Number(box.width)||430,

h:Number(box.height)||270,

items:items.filter(
item=>
item.visibility==="public"||
String(box.owner_id)===
String(user.id)
)

};

});


render();

}


/* =========================================================
NEW BOX
========================================================= */

document.getElementById("newBoxButton")
.addEventListener(
"click",
async()=>{

if(!user)return;


const ownBoards=
boards.filter(
b=>
String(b.owner_id)===
String(user.id)
);


const previous=
ownBoards[ownBoards.length-1];


let x=120;
let y=120;


if(previous){

x=
Number(previous.x)+
Number(previous.w)+
40;

y=
Number(previous.y);

}


const {data,error}=
await supabase
.from("boxes")
.insert({

owner_id:user.id,
title:"New box",
x:x,
y:y,
width:430,
height:270,
visibility:"public"

})
.select()
.single();


if(error){

showError(error.message);
return;

}


boards.push({

...data,

w:Number(data.width)||430,
h:Number(data.height)||270,
items:[]

});


selectedBoardId=data.id;

render();

});


/* =========================================================
NEW URL
========================================================= */

document.getElementById("newUrlButton")
.addEventListener(
"click",
()=>{

if(!user)return;


const ownBoxes=
boards.filter(
board=>
String(board.owner_id)===
String(user.id)
);


if(!ownBoxes.length){

showError("Create a box first.");
return;

}


openURLModal(
ownBoxes[ownBoxes.length-1]
);

});


/* =========================================================
ADD URL MODAL
========================================================= */

function openURLModal(board){

openModal(`

<h2>Add URL</h2>

<input
id="urlTitle"
placeholder="Name (optional)"
>

<input
id="urlAddress"
placeholder="https://example.com"
>

<input
id="urlImage"
placeholder="Image URL (optional)"
>

<p>
Who should be able to see this URL?
</p>

<div class="choice">

<button id="publicURLButton">
Public
</button>

<button id="privateURLButton">
Private
</button>

</div>

<div class="modal-actions">

<button id="cancelURLButton">
Cancel
</button>

</div>

`);


document.getElementById("cancelURLButton")
.onclick=closeModal;


document.getElementById("publicURLButton")
.onclick=
()=>saveURL(board,"public");


document.getElementById("privateURLButton")
.onclick=
()=>saveURL(board,"private");

}


/* =========================================================
SAVE URL
IMPORTANT:
SAVE OWNER_ID WITH EVERY URL
========================================================= */

async function saveURL(board,visibility){

let url=
document.getElementById("urlAddress")
.value
.trim();


const title=
document.getElementById("urlTitle")
.value
.trim();


const image=
document.getElementById("urlImage")
.value
.trim();


if(!url){

showError("Enter a URL.");
return;

}


if(!/^https?:\/\//i.test(url)){

url="https://"+url;

}


const {data,error}=
await supabase
.from("box_items")
.insert({

box_id:board.id,

/*
THIS IS THE IMPORTANT CHANGE.
The URL remembers who created it.
*/
owner_id:user.id,

title:title||url,

url:url,

image:image||null,

visibility:visibility

})
.select()
.single();


if(error){

showError(error.message);
return;

}


board.items.push(data);

closeModal();

render();

}


/* =========================================================
DELETE URL
========================================================= */

async function deleteURL(board,itemId){

const confirmed=
confirm("Delete this URL?");


if(!confirmed)return;


const {error}=
await supabase
.from("box_items")
.delete()
.eq("id",itemId)
.eq("box_id",board.id);


if(error){

showError(
"Could not delete URL: "+error.message
);

return;

}


board.items=
board.items.filter(
item=>
String(item.id)!==
String(itemId)
);


render();

}


/* =========================================================
DELETE BOX
========================================================= */

async function deleteBoard(board){

if(!user){

showError("You must be logged in.");
return;

}


if(
String(board.owner_id)!==
String(user.id)
){

showError(
"You can only delete your own boxes."
);

return;

}


const confirmed=
confirm(
"Delete this box and all of its URLs?"
);


if(!confirmed)return;


const {error:itemError}=
await supabase
.from("box_items")
.delete()
.eq("box_id",board.id);


if(itemError){

showError(
"Could not delete the URLs in this box: "+
itemError.message
);

return;

}


const {data:deleted,error:boxError}=
await supabase
.from("boxes")
.delete()
.eq("id",board.id)
.eq("owner_id",user.id)
.select();


if(boxError){

showError(
"Could not delete box: "+
boxError.message
);

return;

}


if(!deleted||deleted.length===0){

showError(
"Supabase did not allow this box to be deleted. Check the DELETE policy for the boxes table."
);

return;

}


boards=
boards.filter(
b=>
String(b.id)!==
String(board.id)
);


if(
String(selectedBoardId)===
String(board.id)
){

selectedBoardId=null;

}


render();

}


/* =========================================================
LOAD URL CREATOR NICKNAME
========================================================= */

async function loadItemNickname(item,nicknameElement){

if(!item.owner_id){

nicknameElement.textContent=
"Unknown";

return;

}


/*
If this URL was created by the current user,
use the already-loaded profile.
*/

if(
user&&
String(item.owner_id)===
String(user.id)
){

nicknameElement.textContent=
currentProfile?.nickname||
"Unknown";

return;

}


/*
Otherwise get the profile belonging
to the URL creator.
*/

const {data,error}=
await supabase
.from("profiles")
.select("nickname")
.eq("id",item.owner_id)
.maybeSingle();


if(error){

console.error(error);

nicknameElement.textContent=
"Unknown";

return;

}


nicknameElement.textContent=
data?.nickname||
"Unknown";

}


/* =========================================================
RENDER
========================================================= */

function render(){

const world=
document.getElementById("world");


world.style.transform=
`translate(${panX}px,${panY}px) scale(${zoom})`;


world.innerHTML="";


boards.forEach(board=>{

const element=
document.createElement("section");


element.className=
"board"+
(
String(selectedBoardId)===
String(board.id)
?" selected"
:""
);


element.dataset.id=board.id;


element.style.left=
Number(board.x)+"px";


element.style.top=
Number(board.y)+"px";


element.style.width=
Number(board.w)+"px";


element.style.height=
Number(board.h)+"px";


const owner=
String(board.owner_id)===
String(user?.id);


element.innerHTML=`

<div class="board-title">
${escapeHTML(board.title)}
</div>


${
owner
?
`
<div class="board-actions">

<button
class="trash-button"
title="Delete box"
data-delete-board="${board.id}">
🗑
</button>

</div>
`
:""
}


<div class="board-inner">


${
owner
?
`
<button
class="add-url"
data-add-url="${board.id}">
+ Add URL
</button>
`
:""
}


${
board.items.map(item=>`

<div
class="item"
data-item-id="${item.id}"
data-url="${escapeHTML(item.url)}">


${
item.image
?
`
<img
src="${escapeHTML(item.image)}"
alt=""
>
`
:""
}


<div class="item-content">

<div
class="item-nickname"
data-item-owner-id="${escapeHTML(item.owner_id || "")}">

${
item.owner_id &&
user &&
String(item.owner_id)===String(user.id)
?
escapeHTML(
currentProfile?.nickname||"Unknown"
)
:
"Loading..."
}

</div>


<div class="item-title">

${escapeHTML(item.title||item.url)}

</div>

</div>


<span class="item-visibility">

${item.visibility==="public"?"Public":"Private"}

</span>


${
owner
?
`
<button
class="item-trash"
title="Delete URL"
data-delete-item="${item.id}">
🗑
</button>
`
:""
}


</div>

`).join("")
}


</div>


${
owner
?
`
<div class="resize"></div>
`
:""
}

`;


/* =========================================================
LOAD NICKNAME FOR EACH URL
========================================================= */

element
.querySelectorAll(".item")
.forEach(itemElement=>{

const itemId=
itemElement.dataset.itemId;


const item=
board.items.find(
i=>
String(i.id)===
String(itemId)
);


if(!item)return;


const nicknameElement=
itemElement.querySelector(
".item-nickname"
);


if(nicknameElement){

loadItemNickname(
item,
nicknameElement
);

}

});


/* BOARD CLICK */

element.addEventListener(
"click",
event=>{

if(event.target.closest(".trash-button"))
return;

if(event.target.closest(".item-trash"))
return;

if(event.target.closest(".add-url"))
return;

if(event.target.closest(".resize"))
return;

selectedBoardId=board.id;

render();

});


/* DELETE BUTTON */

const deleteBoardButton=
element.querySelector(
"[data-delete-board]"
);


if(deleteBoardButton){

deleteBoardButton.addEventListener(
"click",
async event=>{

event.preventDefault();
event.stopPropagation();

await deleteBoard(board);

});

}


/* ADD URL */

const addButton=
element.querySelector(
"[data-add-url]"
);


if(addButton){

addButton.addEventListener(
"click",
event=>{

event.preventDefault();
event.stopPropagation();

openURLModal(board);

});

}


/* DELETE URL */

element
.querySelectorAll("[data-delete-item]")
.forEach(button=>{

button.addEventListener(
"click",
async event=>{

event.preventDefault();
event.stopPropagation();

await deleteURL(
board,
button.dataset.deleteItem
);

});

});


/* OPEN URL */

element
.querySelectorAll(".item")
.forEach(item=>{

item.addEventListener(
"click",
event=>{

if(event.target.closest(".item-trash"))
return;

const url=
item.dataset.url;


if(url){

window.open(
url,
"_blank"
);

}

});

});


/* CONTEXT MENU */

element.addEventListener(
"contextmenu",
event=>{

if(!owner)return;

event.preventDefault();

contextBoardId=board.id;


const menu=
document.getElementById("contextMenu");


menu.style.display="block";

menu.style.left=
event.clientX+"px";

menu.style.top=
event.clientY+"px";

});


/* MOVE + RESIZE */

if(owner){

element.addEventListener(
"pointerdown",
event=>{

if(event.pointerType==="touch")
return;

if(event.target.closest(".item"))
return;

if(event.target.closest(".add-url"))
return;

if(event.target.closest(".trash-button"))
return;


if(event.target.closest(".resize")){

resizing={

id:board.id,

startX:event.clientX,
startY:event.clientY,

width:board.w,
height:board.h

};


element.setPointerCapture(
event.pointerId
);

return;

}


moving={

id:board.id,

startX:event.clientX,
startY:event.clientY,

x:board.x,
y:board.y

};


element.setPointerCapture(
event.pointerId
);

});


element.addEventListener(
"pointermove",
event=>{

if(resizing?.id===board.id){

board.w=
Math.max(
180,
resizing.width+
(event.clientX-resizing.startX)/zoom
);


board.h=
Math.max(
120,
resizing.height+
(event.clientY-resizing.startY)/zoom
);


render();

return;

}


if(moving?.id===board.id){

board.x=
moving.x+
(event.clientX-moving.startX)/zoom;


board.y=
moving.y+
(event.clientY-moving.startY)/zoom;


render();

}

});


element.addEventListener(
"pointerup",
async()=>{

if(moving){

await supabase
.from("boxes")
.update({

x:board.x,
y:board.y

})
.eq("id",board.id)
.eq("owner_id",user.id);

}


if(resizing){

await supabase
.from("boxes")
.update({

width:board.w,
height:board.h

})
.eq("id",board.id)
.eq("owner_id",user.id);

}


moving=null;
resizing=null;

});

}


world.appendChild(element);

});

}


/* =========================================================
DESKTOP PAN
========================================================= */

const workspace=
document.getElementById("workspace");


workspace.addEventListener(
"pointerdown",
event=>{

if(event.pointerType==="touch")
return;


if(event.target.closest(".board"))
return;


panning={

x:event.clientX,
y:event.clientY,

panX:panX,
panY:panY

};

});


document.addEventListener(
"pointermove",
event=>{

if(!panning)return;


panX=
panning.panX+
event.clientX-
panning.x;


panY=
panning.panY+
event.clientY-
panning.y;


render();

});


document.addEventListener(
"pointerup",
()=>{
panning=null;
});


/* =========================================================
TOUCH
========================================================= */

function distance(a,b){

return Math.hypot(
a.clientX-b.clientX,
a.clientY-b.clientY
);

}


function midpoint(a,b){

return{

x:(a.clientX+b.clientX)/2,
y:(a.clientY+b.clientY)/2

};

}


workspace.addEventListener(
"pointerdown",
event=>{

if(event.pointerType!=="touch")
return;


pointers.set(
event.pointerId,
{
clientX:event.clientX,
clientY:event.clientY
}
);


if(pointers.size===1){

if(!event.target.closest(".board")){

panning={

x:event.clientX,
y:event.clientY,

panX:panX,
panY:panY

};

}

}


if(pointers.size===2){

panning=null;


const points=
[...pointers.values()];


pinchStartDistance=
distance(
points[0],
points[1]
);


pinchStartZoom=zoom;


pinchStartCenter=
midpoint(
points[0],
points[1]
);


pinchStartPanX=panX;
pinchStartPanY=panY;

}

});


workspace.addEventListener(
"pointermove",
event=>{

if(event.pointerType!=="touch")
return;


if(!pointers.has(event.pointerId))
return;


pointers.set(
event.pointerId,
{
clientX:event.clientX,
clientY:event.clientY
}
);


if(
pointers.size===1&&
panning
){

panX=
panning.panX+
event.clientX-
panning.x;


panY=
panning.panY+
event.clientY-
panning.y;


render();

return;

}


if(pointers.size===2){

const points=
[...pointers.values()];


const currentDistance=
distance(
points[0],
points[1]
);


if(!pinchStartDistance)
return;


let newZoom=
pinchStartZoom*
(
currentDistance/
pinchStartDistance
);


newZoom=
Math.max(
0.25,
Math.min(
3,
newZoom
)
);


const center=
midpoint(
points[0],
points[1]
);


const rect=
workspace.getBoundingClientRect();


const worldX=
(
pinchStartCenter.x-
rect.left-
pinchStartPanX
)/
pinchStartZoom;


const worldY=
(
pinchStartCenter.y-
rect.top-
pinchStartPanY
)/
pinchStartZoom;


panX=
center.x-
rect.left-
worldX*newZoom;


panY=
center.y-
rect.top-
worldY*newZoom;


zoom=newZoom;

render();

}

});


function endTouch(event){

if(event.pointerType!=="touch")
return;


pointers.delete(
event.pointerId
);


if(pointers.size<2){

pinchStartDistance=null;

}


if(pointers.size===0){

panning=null;

}

}


workspace.addEventListener(
"pointerup",
endTouch
);


workspace.addEventListener(
"pointercancel",
endTouch
);


/* =========================================================
MOUSE WHEEL ZOOM
========================================================= */

workspace.addEventListener(
"wheel",
event=>{

event.preventDefault();


const rect=
workspace.getBoundingClientRect();


const mouseX=
event.clientX-rect.left;


const mouseY=
event.clientY-rect.top;


const worldX=
(mouseX-panX)/zoom;


const worldY=
(mouseY-panY)/zoom;


const factor=
event.deltaY<0
?1.1
:0.9;


zoom=
Math.max(
0.25,
Math.min(
3,
zoom*factor
)
);


panX=
mouseX-worldX*zoom;


panY=
mouseY-worldY*zoom;


render();

},
{
passive:false
}
);


/* =========================================================
CONTEXT MENU CLOSE
========================================================= */

document.addEventListener(
"pointerdown",
event=>{

if(!event.target.closest("#contextMenu")){

document.getElementById("contextMenu")
.style.display="none";

}

});


/* =========================================================
RENAME
========================================================= */

document.getElementById("renameOption")
.addEventListener(
"click",
async()=>{

document.getElementById("contextMenu")
.style.display="none";


const board=
boards.find(
b=>
String(b.id)===
String(contextBoardId)
);


if(!board)return;


if(
String(board.owner_id)!==
String(user.id)
){

showError(
"You can only rename your own boxes."
);

return;

}


openModal(`

<h2>Rename box</h2>

<input
id="renameInput"
value="${escapeHTML(board.title)}"
>

<div class="modal-actions">

<button id="renameCancel">
Cancel
</button>

<button id="renameSave">
Save
</button>

</div>

`);


document.getElementById("renameCancel")
.onclick=closeModal;


document.getElementById("renameSave")
.onclick=async()=>{

const title=
document.getElementById("renameInput")
.value
.trim();


if(!title)return;


const {error}=
await supabase
.from("boxes")
.update({
title:title
})
.eq("id",board.id)
.eq("owner_id",user.id);


if(error){

showError(error.message);
return;

}


board.title=title;

closeModal();

render();

};

});


/* =========================================================
DELETE CONTEXT MENU
========================================================= */

document.getElementById("deleteOption")
.addEventListener(
"click",
async()=>{

document.getElementById("contextMenu")
.style.display="none";


const board=
boards.find(
b=>
String(b.id)===
String(contextBoardId)
);


if(board){

await deleteBoard(board);

}

});


/* =========================================================
SEARCH
========================================================= */

document.getElementById("searchInput")
.addEventListener(
"input",
event=>{

const query=
event.target.value
.toLowerCase()
.trim();


document
.querySelectorAll(".board")
.forEach(element=>{

const board=
boards.find(
b=>
String(b.id)===
String(element.dataset.id)
);


if(!board)return;


const matches=
!query||

board.title
.toLowerCase()
.includes(query)||

board.items.some(
item=>
(item.title||"")
.toLowerCase()
.includes(query)||

(item.url||"")
.toLowerCase()
.includes(query)
);


element.style.opacity=
matches
?"1"
:"0.2";

});

});


/* =========================================================
SHARE
========================================================= */

document.getElementById("shareButton")
.addEventListener(
"click",
async()=>{

const data={

title:"Spaceboards",

text:"Check out my Spaceboards!",

url:window.location.href

};


try{

if(navigator.share){

await navigator.share(data);

}else{

await navigator.clipboard.writeText(
window.location.href
);

alert(
"Website link copied to clipboard."
);

}

}catch(error){

if(error.name!=="AbortError"){

try{

await navigator.clipboard.writeText(
window.location.href
);

alert(
"Website link copied to clipboard."
);

}catch(e){

prompt(
"Copy this link:",
window.location.href
);

}

}

}

});


/* =========================================================
MODAL CLOSE
========================================================= */

document.getElementById("modalBackground")
.addEventListener(
"click",
event=>{

if(event.target.id==="modalBackground"){

closeModal();

}

});


/* =========================================================
INITIAL
========================================================= */

updateAuthUI();

render();

</script>
